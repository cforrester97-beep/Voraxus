      firePermanentTrigger("turnStart");
      updateStatus();

      actionsBox.innerHTML = "";
      logMessage("<b>Voraxus performs main phase actions...</b>");

      const mainCount = randomInt(4) + 1;
      const postCount = randomInt(4) + 1;
      let mainDone = 0;
      let postDone = 0;
      let phase = "main";

      const continueButton = createButton("Continue", null);
      continueButton.classList.add("button-accent");
      continueButton.onclick = function () {
        if (phase === "main") {
          handleOutcome();
          mainDone++;
          if (mainDone >= mainCount) {
            phase = "combat";
          }
        } else if (phase === "combat") {
          logMessage("<b>Voraxus goes to combat.</b>");
          assignAttackTargets();
          logAttackAssignments();
          updateStatus();
          phase = "post";
        } else if (phase === "post") {
          if (postDone === 0) {
            logMessage("<b>Voraxus performs post-combat actions...</b>");
          }
          handleOutcome();
          postDone++;
          if (postDone >= postCount) {
            const maxHand = effectiveMaxHandSize();
            if (maxHand != null && gameState.voraxusCards > maxHand) {
              const discarded = gameState.voraxusCards - maxHand;
              gameState.voraxusCards = maxHand;
              logVoraxusAction(`${gameState.botName} discards ${discarded} card(s) to have a maximum hand of ${maxHand}.`);
            }
            updateStatus();
            continueButton.textContent = "Finish Turn";
            phase = "done";
          }
        } else {
          showMainMenu();
        }
      };

      const turnControls = document.createElement("div");
      turnControls.appendChild(continueButton);
      turnControls.appendChild(createOpponentsButtons(false));
      actionsBox.appendChild(turnControls);
    }

    /* ------------------------------------------------------------------
     *  Main menu
     * ---------------------------------------------------------------- */
    function showMainMenu() {
      finalizeNewCreatures();
      renderMainMenuButtons();
    }

    /** Renders the main menu buttons without touching creature "new" flags.
        Used both by showMainMenu() and by handleUndo(), which must not
        finalize creatures that a restored snapshot still marks as new. */
    function renderMainMenuButtons() {
      btnForceDiscardRef = null;
      btnRemoveManaRef = null;
      btnRemoveManaSourceRef = null;

      actionsBox.innerHTML = "";
      actionsBox.appendChild(createButton("Opponents' Turn", handleOpponentsTurn));
      actionsBox.appendChild(createButton("Voraxus' Turn", handleVoraxusTurn));
      updateStatus();
    }

    /* ------------------------------------------------------------------
     *  On page load
     * ---------------------------------------------------------------- */
    window.onload = function () {
      setUpThemePicker();
      setUpMusicToggle();
      setUpVolumeSlider();
      setUpStatsDialog();
      setUpPayDecisionButton();

      configBox = document.getElementById("configBox");
      statusBar = document.getElementById("statusBar");
      commandZoneBar = document.getElementById("commandZoneBar");
      logBox = document.getElementById("logBox");
      actionsBox = document.getElementById("actionsBox");
      creaturesBox = document.getElementById("creaturesBox");
      artifactsBox = document.getElementById("artifactsBox");

      numberDialog = document.getElementById("numberDialog");
      numberDialogMessage = document.getElementById("numberDialogMessage");
      numberDialogInput = document.getElementById("numberDialogInput");
      numberDialogMinus = document.getElementById("numberDialogMinus");
      numberDialogPlus = document.getElementById("numberDialogPlus");
      numberDialogCancel = document.getElementById("numberDialogCancel");
      numberDialogOk = document.getElementById("numberDialogOk");
      numberDialogMinus.onclick = () => stepNumberDialog(-1);
      numberDialogPlus.onclick = () => stepNumberDialog(1);

      confirmDialog = document.getElementById("confirmDialog");
      confirmDialogMessage = document.getElementById("confirmDialogMessage");
      confirmCancelBtn = document.getElementById("confirmCancelBtn");
      confirmOkBtn = document.getElementById("confirmOkBtn");
      removalDialog = document.getElementById("removalDialog");
      removalDialogMessage = document.getElementById("removalDialogMessage");
      removalBounceBtn = document.getElementById("removalBounceBtn");
      removalDestroyBtn = document.getElementById("removalDestroyBtn");
      removalStunBtn = document.getElementById("removalStunBtn");
      removalCancelBtn = document.getElementById("removalCancelBtn");

      giveCreatureDialog = document.getElementById("giveCreatureDialog");
      giveCreaturePower = document.getElementById("giveCreaturePower");
      giveCreatureToughness = document.getElementById("giveCreatureToughness");
      giveCreatureAbility = document.getElementById("giveCreatureAbility");
      giveCreatureType = document.getElementById("giveCreatureType");
      giveCreatureCancelBtn = document.getElementById("giveCreatureCancel");
      giveCreatureOkBtn = document.getElementById("giveCreatureOk");
      // Populated from V_ABILITIES rather than hardcoded in the HTML, so
      // adding a new ability to that list later (as mentioned — more
      // obscure ones down the road) automatically shows up here too.
      giveCreatureAbility.innerHTML = `<option value="">None</option>` +
        V_ABILITIES.map(a => `<option value="${a}">${a}</option>`).join("");

      creaturesBox.addEventListener("click", handleCreatureTap);
      artifactsBox.addEventListener("click", handleArtifactTap);

      btnUndoRef = document.getElementById("undoBtn");
      btnUndoRef.onclick = handleUndo;
      refreshUndoButtonState();

      document.getElementById("exportLogBtn").onclick = handleExportLog;

      document.getElementById("resetGameBtn").onclick = async () => {
        const confirmed = await showConfirmDialog("Reset the game? This will erase all progress.", { confirmLabel: "Reset" });
        if (confirmed) {
          clearSavedGame();
          location.reload();
        }
      };

      const saved = loadGameState();
      if (saved) {
        showResumeScreen(saved);
      } else {
        showConfigScreen();
      }
    };
  </script>

  <script>
    /* Offline support, only when hosted as an installable app. It's
       skipped when the file is opened directly from disk (file://), and
       any failure is swallowed, so the game itself always still loads. */
    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
