<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Voraxus Game Interface</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Voraxus" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1a0f0a" />

  <!-- Magic-inspired fonts: Decorative for the hero title, plain Cinzel for section headers -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cinzel+Decorative&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --font-title: "Cinzel Decorative", serif;      /* hero title only */
      --font-display: "Cinzel", serif;                /* section headers */
      --font-body: Georgia, "Times New Roman", serif; /* legible body copy */
      --bg-color: #c9d6b3;     /* sage green background (swapped by color scheme) */
      --text-color: #3e2723;   /* dark brown text (swapped by color scheme) */
      --box-bg: #fff3e0;
      --button-bg: #d7ccc8;
      --box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
      --tap-target: 44px;      /* minimum comfortable touch target */

      /* Fixed accent that reads against every color scheme — the one
         deliberate flourish (focus rings, dividers, "new" highlights). */
      --accent-gold: #c9a227;
      --accent-gold-soft: rgba(201, 162, 39, 0.35);

      --radius-panel: 10px;
      --radius-button: 10px;

      /* Single source of truth for every dialogue box's height (config,
         status, log, and both creature boxes) — set once here and again
         per breakpoint below, so "uniform size" is guaranteed by
         construction rather than by keeping several clamp() values in
         sync by hand. */
      --box-height: clamp(200px, 29vh, 300px);
    }

    * {
      box-sizing: border-box;
    }

    html {
      /* Prevents iOS Safari from auto-zooming when a form field is focused. */
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 14px;
      overflow-x: hidden;
      font-family: var(--font-body);
      font-size: 15px;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s ease, color 0.3s ease;
      text-align: center;
    }

    /* Brief shake whenever Voraxus does anything but nothing — see
       triggerScreenShake(). Skipped entirely for anyone who's asked the
       OS for reduced motion, rather than trying to offer a gentler
       version. */
    @media (prefers-reduced-motion: no-preference) {
      @keyframes voraxus-shake {
        0%, 100% { transform: translate(0, 0); }
        15% { transform: translate(-7px, 4px); }
        30% { transform: translate(6px, -5px); }
        45% { transform: translate(-5px, 5px); }
        60% { transform: translate(5px, -3px); }
        75% { transform: translate(-3px, 3px); }
        90% { transform: translate(2px, -2px); }
      }

      body.voraxus-shake-active {
        animation: voraxus-shake 0.4s ease-in-out;
      }
    }

    h1,
    h2 {
      font-family: var(--font-display);
      font-weight: 600;
      user-select: none;
    }

    h1 {
      margin: 0;
      font-family: var(--font-title);
      font-size: clamp(1.5em, 4.2vw, 2.3em);
      letter-spacing: 0.04em;
      text-shadow: 0 0 14px var(--accent-gold-soft), 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    h2 {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 8px;
      font-size: clamp(0.95em, 2.2vw, 1.15em);
      letter-spacing: 0.02em;
    }

    h2::before {
      content: "";
      display: inline-block;
      width: 3px;
      align-self: stretch;
      background: var(--accent-gold);
      border-radius: 2px;
    }

    /* Ornamental divider under the title, the design's one bold flourish */
    .title-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      max-width: 220px;
      margin: 6px auto 0;
      color: var(--accent-gold);
      user-select: none;
    }

    .title-ornament::before,
    .title-ornament::after {
      content: "";
      flex: 1 1 auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
    }

    .title-ornament span {
      font-size: 0.9em;
      line-height: 1;
    }

    header,
    main,
    footer {
      margin-bottom: 12px;
    }

    /* Panels are framed with a thin gold hairline set slightly inside the
       border, giving a carved-tablet look instead of a flat rounded card. */
    .game-box {
      position: relative;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid var(--text-color);
      border-radius: var(--radius-panel);
      background-color: var(--box-bg);
      box-shadow: inset 0 0 0 3px var(--box-bg), inset 0 0 0 4px var(--accent-gold-soft), var(--box-shadow);
      transition: background-color 0.3s ease, border-color 0.3s ease;
      scrollbar-width: thin;
      scrollbar-color: var(--accent-gold) transparent;
    }

    .game-box::-webkit-scrollbar {
      width: 8px;
    }

    .game-box::-webkit-scrollbar-thumb {
      background-color: var(--accent-gold);
      border-radius: 4px;
    }

    .game-box::-webkit-scrollbar-track {
      background: transparent;
    }

    /* Color scheme picker, shown above everything else */
    #themeBar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    #themeBar label {
      margin: 0;
    }

    #themeSelect {
      min-height: var(--tap-target);
      padding: 6px 10px;
      font-size: 16px; /* 16px avoids iOS auto-zoom-on-focus */
      font-family: var(--font-body);
      color: var(--text-color);
      background-color: var(--box-bg);
      border: 2px solid var(--text-color);
      border-radius: var(--radius-button);
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    /* Config screen: full width, adaptive height, scrollable */
    /* The config box sizes to its content rather than using
       var(--box-height) like the in-game panels: it's a one-time setup
       screen with a known, fixed amount of content, so it should show
       all of it at once rather than making the player scroll a short
       form. The max-height still guards against overflowing a short
       viewport, in which case it scrolls as before. */
    #configBox {
      width: 100%;
      max-width: 640px;
      height: auto;
      max-height: min(72vh, 560px);
      margin-left: auto;
      margin-right: auto;
      padding: 16px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* The status bar: a slim, full-width strip directly below the
       header, sized to its content (not var(--box-height), which is
       for the taller scrollable boxes) — this is what actually makes it
       "minimal space": height comes from a single row of icon+number
       pairs and normal padding, nothing more. Hidden by default (see
       the Start Game / Resume Game handlers) so it isn't just an empty
       bordered strip sitting above the config screen before there's
       any Voraxus stats to actually show. */
    #statusBar {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin: 8px auto 10px;
      padding: 8px 16px;
    }

    /* Command zone: a second slim strip under the status bar. The
       commander is never permanently answered (rule 903.9), so it needs
       a fixed home on screen rather than only appearing among the
       creatures — this shows where it currently is and what the next
       cast costs after commander tax. */
    #commandZoneBar {
      display: none;
      width: 100%;
      box-sizing: border-box;
      margin: 0 auto 10px;
      padding: 7px 16px;
      border-left-width: 6px;
    }

    .cmd-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 14px;
    }

    .cmd-name {
      font-family: var(--font-display);
      font-weight: 600;
    }

    .cmd-zone-tag {
      font-size: 0.78em;
      padding: 1px 8px;
      border-radius: 999px;
      border: 1px dashed var(--text-color);
      opacity: 0.8;
    }

    .cmd-zone-tag.on-field {
      border-style: solid;
      background-color: var(--accent-gold);
      color: #2a1c05;
      opacity: 1;
    }

    /* The commander's passive, shown under its stat line. Dimmed while
       the commander sits in the command zone, where it does nothing. */
    .cmd-passive {
      margin-top: 5px;
      font-size: 0.82em;
      line-height: 1.35;
      opacity: 0.9;
    }

    .cmd-passive.inactive {
      opacity: 0.55;
    }

    .cmd-vanilla {
      font-size: 0.85em;
      font-style: italic;
      opacity: 0.6;
    }

    #logBox {
      width: 100%;
      box-sizing: border-box;
      margin: 10px auto;
      height: var(--box-height);
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* Status readout: one row, icon + number, wrapping only if the
       viewport is too narrow to fit everything on one line — never by
       shrinking the icons or text themselves. */
    .status-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px 18px;
    }

    .status-stat {
      display: inline-flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }

    .hand-limit {
      font-size: 0.82em;
      opacity: 0.75;
      color: var(--accent-gold);
      font-weight: bold;
    }

    .status-stat .stat-icon {
      font-size: 1.1em;
      color: var(--accent-gold);
      width: 1.4em;
      text-align: center;
    }

    /* Container for the creatures box and the artifacts/enchantments box, side by side */
    #creaturesContainer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin: 10px auto;
    }

    /* Each box: adaptive width/height, scrollable */
    #creaturesBox,
    #artifactsBox {
      position: relative;
      flex: 1 1 46%;
      min-width: 260px;
      height: var(--box-height);
      padding: 10px;
      overflow-y: auto;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      border: 1px solid var(--text-color);
      border-radius: var(--radius-panel);
      background-color: var(--box-bg);
      box-shadow: inset 0 0 0 3px var(--box-bg), inset 0 0 0 4px var(--accent-gold-soft), var(--box-shadow);
      scrollbar-width: thin;
      scrollbar-color: var(--accent-gold) transparent;
    }

    #creaturesBox::-webkit-scrollbar,
    #artifactsBox::-webkit-scrollbar {
      width: 8px;
    }

    #creaturesBox::-webkit-scrollbar-thumb,
    #artifactsBox::-webkit-scrollbar-thumb {
      background-color: var(--accent-gold);
      border-radius: 4px;
    }

    /* Creature list, styled as small cards rather than a bare <ul> */
    .creature-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .creature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      background-color: var(--bg-color);
      border: 1px solid var(--text-color);
      border-left: 5px solid var(--creature-color, var(--accent-gold));
      border-radius: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, border-color 0.3s ease;
    }

    .creature-icon {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      color: var(--creature-color, var(--accent-gold));
      animation: creature-float 2.6s ease-in-out infinite;
    }

    @keyframes creature-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .creature-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .attack-tag {
      display: inline-block;
      margin-top: 3px;
      padding: 1px 7px;
      font-size: 0.75em;
      font-family: var(--font-body);
      border-radius: 6px;
      background-color: var(--accent-gold-soft);
      color: var(--text-color);
      white-space: nowrap;
    }

    .attack-tag.sick,
    .attack-tag.unassigned {
      background-color: transparent;
      border: 1px dashed var(--text-color);
      opacity: 0.65;
    }

    /* Stun counters: the creature is tapped and will skip that many
       untap steps before it comes back. */
    .attack-tag.stun {
      background-color: transparent;
      border: 1px solid var(--accent-gold);
      color: var(--text-color);
      font-weight: bold;
      margin-right: 4px;
    }

    /* Tapped: committed to the attack and unable to block. Rotated
       slightly as a nod to physically turning a card sideways. */
    .attack-tag.tapped {
      background-color: transparent;
      border: 1px solid var(--text-color);
      opacity: 0.8;
      transform: rotate(-4deg);
    }

    /* Ability badges: same pill shape as attack-tag, but colored by the
       creature's own accent so the two kinds of tag (combat status vs.
       ability) read as visually distinct groups at a glance. Multiple
       tags wrap naturally since each is just an inline-block span. */
    .ability-tag {
      display: inline-block;
      margin: 3px 4px 0 0;
      padding: 1px 7px;
      font-size: 0.75em;
      font-family: var(--font-body);
      border-radius: 6px;
      background-color: var(--creature-color, var(--accent-gold));
      color: #fff;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.4);
      white-space: nowrap;
    }

    .creature-item:hover {
      box-shadow: 0 0 0 2px var(--accent-gold-soft);
    }

    .creature-item:active {
      transform: scale(0.97);
      background-color: var(--accent-gold-soft);
    }

    .creature-item.is-new {
      animation: creature-arrive 900ms ease-out 1;
    }

    @keyframes creature-arrive {
      0% { box-shadow: 0 0 0 0 var(--accent-gold-soft); }
      60% { box-shadow: 0 0 0 8px transparent; }
      100% { box-shadow: none; }
    }

    /* Artifacts & enchantments list — same visual language as the
       creature list (card-style rows, left accent border, tap to
       remove), just without the power/toughness/attack-status parts
       that don't apply to this permanent type. */
    .permanent-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .permanent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      text-align: left;
      cursor: pointer;
      background-color: var(--bg-color);
      border: 1px solid var(--text-color);
      border-left: 5px solid var(--accent-gold);
      border-radius: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .permanent-item:hover {
      box-shadow: 0 0 0 2px var(--accent-gold-soft);
    }

    .permanent-item:active {
      transform: scale(0.97);
      background-color: var(--accent-gold-soft);
    }

    .permanent-icon {
      flex: 0 0 auto;
      font-size: 1.4em;
      width: 30px;
      text-align: center;
      color: var(--accent-gold);
    }

    .permanent-text {
      flex: 1 1 auto;
      min-width: 0;
    }

    .permanent-type {
      font-size: 0.8em;
      opacity: 0.75;
    }

    /* Mana cost badge, shared by creature cards and by artifacts and
       enchantments so a cost reads the same way everywhere on screen. */
    .permanent-cost,
    .creature-cost {
      display: inline-block;
      min-width: 1.5em;
      padding: 0 6px;
      font-size: 0.78em;
      text-align: center;
      border-radius: 999px;
      background-color: var(--accent-gold);
      color: #2a1c05;
    }

    /* The standing-effect rules text, shown on every permanent so the
       box works as a live reference for what's currently in play. */
    .permanent-effect {
      display: block;
      margin-top: 3px;
      font-size: 0.8em;
      line-height: 1.35;
      opacity: 0.9;
    }

    /* Marks the two permanents whose effects tax the PLAYERS' mana,
       which lives outside the app and so can't be automated. */
    .permanent-manual {
      font-size: 0.72em;
      font-style: italic;
      opacity: 0.7;
    }

    /* Brief full-screen creature silhouette when something enters the
       battlefield — see flashCreature(). Centred, non-interactive, and
       sized off the viewport so it reads the same on a phone and a
       tablet. */
    .creature-flash {
      position: fixed;
      top: 50%;
      left: 50%;
      width: min(52vw, 320px);
      height: min(52vw, 320px);
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 9999;
      opacity: 0;
    }

    .creature-flash svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.45));
    }

    @media (prefers-reduced-motion: no-preference) {
      .creature-flash {
        animation: creature-flash-in 850ms ease-out 1;
      }

      @keyframes creature-flash-in {
        0%   { opacity: 0;    transform: translate(-50%, -50%) scale(0.55); }
        22%  { opacity: 0.85; transform: translate(-50%, -50%) scale(1.06); }
        55%  { opacity: 0.6;  transform: translate(-50%, -50%) scale(1.12); }
        100% { opacity: 0;    transform: translate(-50%, -50%) scale(1.35); }
      }
    }

    /* Actions container: no fixed box styling, buttons wrap and stay centered */
    #actionsBox {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 8px;
      width: 90%;
      max-width: 640px;
      margin: 10px auto;
      text-align: center;
    }

    #actionsBox > div {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .button {
      min-height: var(--tap-target);
      min-width: var(--tap-target);
      margin: 3px;
      padding: 8px 14px;
      font-family: var(--font-body);
      font-size: 0.92em;
      color: var(--text-color);
      background-color: var(--button-bg);
      border: 2px solid var(--text-color);
      border-radius: var(--radius-button);
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      transition: background-color 0.15s ease, color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
    }

    .button:hover {
      background-color: var(--text-color);
      color: var(--box-bg);
    }

    /* Touch devices don't have :hover, so :active is what gives tactile
       feedback on tap — a slight press-down rather than relying on color
       change alone. */
    .button:active {
      transform: scale(0.96);
    }

    .button:focus-visible {
      outline: 3px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    /* The one button meant to visually lead during an opponent's turn —
       "Check if Voraxus Responds" gets pressed far more than anything
       else on that screen, so it uses the game's one fixed accent color
       (reads consistently against every theme, unlike --button-bg which
       changes per scheme) with dark text for strong, reliable contrast
       (6.85:1 at rest, 5.08:1 on hover — both comfortably above the 4.5:1
       minimum for legible text; white text here would only hit 2.42:1). */
    .button-primary {
      background-color: var(--accent-gold);
      color: #2a1c05;
      border-color: #7a5f14;
      font-weight: bold;
    }

    .button-primary:hover {
      background-color: #ad8a1f;
      color: #2a1c05;
    }

    .button:disabled:hover {
      background-color: var(--button-bg);
      color: var(--text-color);
    }

    /* Reserved for the single primary action on a screen (Start Game,
       Continue, dialog Confirm) — the accent spent deliberately, not
       sprinkled across every button. */
    .button-accent {
      background-color: var(--accent-gold);
      border-color: #7a5f14;
      color: #2a2005;
      font-weight: bold;
    }

    .button-accent:hover {
      background-color: var(--text-color);
      color: var(--accent-gold);
      border-color: var(--accent-gold);
    }

    /* Color stripes shown in the status box */
    .color-stripes-container {
      display: inline-flex;
      gap: 4px;
      margin-top: 6px;
    }

    .color-stripe {
      width: 46px;
      height: 10px;
      border-radius: 3px;
      border: 1px solid #000;
    }

    /* Small color squares shown next to each creature entry */
    .creature-color-square {
      display: inline-block;
      width: 0.9em;
      height: 0.9em;
      margin-left: 4px;
      vertical-align: middle;
      border: 1px solid black;
      border-radius: 2px;
    }

    label {
      display: inline-block;
      margin: 6px 0;
      font-size: 1.05em;
    }

    /* Config screen: give each row real breathing room rather than
       letting the label, control and next row run together. Each direct
       child div is one row (player count, life preview, library size,
       difficulty, start button). */
    #configBox > div {
      margin-bottom: 18px;
    }

    #configBox > div:last-child {
      margin-bottom: 4px;
    }

    #configBox label {
      display: block;
      margin-bottom: 7px;
    }

    #configBox h2 {
      margin-bottom: 4px;
    }

    #lifePreview {
      opacity: 0.85;
    }

    /* Config screen form controls. Vertical padding and min-height are
       trimmed to keep these flatter, while font-size stays at 16px —
       both because the text shouldn't shrink and because anything
       under 16px triggers iOS's auto-zoom-on-focus. */
    #configBox input[type="number"],
    #configBox select {
      min-height: 34px;
      padding: 3px 8px;
      font-size: 16px;
      font-family: var(--font-body);
      border: 2px solid var(--text-color);
      border-radius: 6px;
      background-color: #fff;
      max-width: 100%;
    }

    /* Modal dialogs, replacing window.prompt()/confirm()/alert() */
    .game-dialog {
      position: relative;
      width: min(92vw, 360px);
      padding: 22px;
      font-family: var(--font-body);
      color: var(--text-color);
      background-color: var(--box-bg);
      border: 1px solid var(--text-color);
      border-radius: var(--radius-panel);
      box-shadow: inset 0 0 0 3px var(--box-bg), inset 0 0 0 4px var(--accent-gold-soft), var(--box-shadow);
    }

    /* A thin themed frame line around each box. The ornamental corner
       and edge scrollwork that used to sit here was removed: those were
       background-image layers, so box content drew straight over them
       and the artwork collided with the text. The border color still
       follows the active color scheme, so each theme keeps its own
       identity without anything sitting behind the content. */
    .game-box,
    #creaturesBox,
    #artifactsBox,
    .game-dialog {
      border-width: 3px;
      border-style: solid;
      border-color: var(--decoration-line-color, var(--text-color));
    }

    .game-dialog::backdrop {
      background: rgba(0, 0, 0, 0.55);
    }

    .game-dialog p {
      margin-top: 0;
      font-size: 1.1em;
    }

    .game-dialog input[type="number"] {
      width: 100%;
      margin: 10px 0;
      padding: 10px;
      text-align: center;
      font-size: 18px; /* 16px+ avoids iOS auto-zoom-on-focus */
      border: 2px solid var(--text-color);
      border-radius: 8px;
      background-color: #fff;
    }

    .game-dialog input[type="text"],
    .game-dialog select {
      width: 100%;
      margin: 4px 0 10px;
      padding: 10px;
      font-size: 16px; /* avoids iOS auto-zoom-on-focus */
      font-family: var(--font-body);
      border: 2px solid var(--text-color);
      border-radius: 8px;
      background-color: #fff;
      box-sizing: border-box;
    }

    .form-row {
      text-align: left;
      margin-bottom: 4px;
    }

    .form-row label {
      display: block;
      margin: 6px 0 0;
      font-size: 0.95em;
    }

    /* +/- stepper flanking the number input, so common small values don't
       need the on-screen keyboard at all on touch devices. */
    .stepper-row {
      display: flex;
      align-items: stretch;
      gap: 8px;
      margin: 10px 0;
    }

    .stepper-row input[type="number"] {
      margin: 0;
      flex: 1 1 auto;
      min-width: 0;
    }

    .stepper-btn {
      flex: 0 0 var(--tap-target);
      min-width: var(--tap-target);
      font-size: 1.3em;
      line-height: 1;
      padding: 0;
    }

    .dialog-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .dialog-buttons .button {
      flex: 1 1 0;
    }

    /* Three-option dialogs (e.g. bounce vs. destroy) stack vertically —
       three full-word labels squeezed side by side wrap badly on a
       phone, and the choices read more clearly one per row anyway. */
    .dialog-buttons-stacked {
      flex-direction: column;
    }

    /* Battle Stats dialog: can genuinely have more content (sparkline +
       up to 15 tally rows) than the other short dialogs, so it gets its
       own scroll rather than overflowing the viewport on a short phone. */
    #statsDialog {
      max-height: 80vh;
      overflow-y: auto;
    }

    #statsCurrentLife {
      font-weight: bold;
      margin: 4px 0 10px;
    }

    .tally-list {
      list-style: none;
      padding: 0;
      margin: 10px 0;
      text-align: left;
      max-height: 240px;
      overflow-y: auto;
    }

    .tally-list li {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 5px 2px;
      border-bottom: 1px solid var(--button-bg);
      font-size: 0.9em;
    }

    .tally-list li:last-child {
      border-bottom: none;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    footer .button {
      background-color: #e0b0a0;
    }

    /* ------------------------------------------------------------
     * Tablet range (iPad mini/Air/Pro, portrait or landscape, and
     * similarly sized Android tablets): this is the primary target —
     * trim heights/margins further so the whole app fits one screen
     * without the page itself needing to scroll.
     * ---------------------------------------------------------- */
    @media (max-width: 1300px) {
      :root {
        --box-height: clamp(175px, 25vh, 250px);
      }
    }

    /* Short viewports specifically (tablet landscape on the smaller end,
       e.g. ~768–820px tall): shrink one step further. */
    @media (max-height: 850px) {
      body {
        margin: 8px;
        font-size: 14px;
      }

      header,
      main,
      footer {
        margin-bottom: 6px;
      }

      .game-box {
        margin: 5px auto;
        padding: 7px;
      }

      :root {
        --box-height: clamp(160px, 21vh, 210px);
      }

      #logBox {
        margin: 5px auto;
      }

      #creaturesContainer {
        margin: 5px auto;
      }

      #actionsBox {
        margin: 5px auto;
      }

      #themeBar {
        margin-bottom: 5px;
      }

      h1 {
        font-size: clamp(1.25em, 3.4vw, 1.8em);
      }

      .title-ornament {
        margin-top: 2px;
      }
    }

    /* ------------------------------------------------------------
     * Phone breakpoint / narrow tablet portrait: stack everything,
     * tighten spacing, keep tap targets large.
     * ---------------------------------------------------------- */
    @media (max-width: 600px) {
      body {
        margin: 10px;
      }

      #creaturesContainer {
        flex-direction: column;
      }

      #creaturesBox,
      #artifactsBox {
        width: 100%;
        min-width: 0;
      }

      .button {
        flex: 1 1 auto;
        padding: 12px 10px;
        font-size: 0.95em;
      }

      footer .button {
        flex: 1 1 40%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        transition-duration: 0.001ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="themeBar">
    <label for="themeSelect">Color Scheme:</label>
    <select id="themeSelect"></select>
    <button id="musicToggleBtn" class="button" type="button">&#127925; Off</button>
    <label for="musicVolumeSlider" class="sr-only">Music Volume</label>
    <input type="range" id="musicVolumeSlider" min="0" max="100" value="80" aria-label="Music Volume" />
    <button id="statsBtn" class="button" type="button">&#128202; Stats</button>
    <button id="payDecisionBtn" class="button" type="button" title="Randomly decide whether Voraxus pays an optional cost">&#128176; Pay?</button>
  </div>

  <header>
    <h1>VORAXUS</h1>
    <div class="title-ornament" aria-hidden="true"><span>&#10022;</span></div>
  </header>

  <div id="statusBar" class="game-box" aria-label="Status" aria-live="polite"></div>
  <div id="commandZoneBar" class="game-box" aria-label="Command Zone" aria-live="polite"></div>

  <main>
    <section id="configBox" class="game-box" aria-label="Game Configuration"></section>
    <section id="logBox" class="game-box" aria-label="Game Log" aria-live="polite"></section>

    <div id="creaturesContainer">
      <section id="creaturesBox" aria-label="Creatures"></section>
      <section id="artifactsBox" aria-label="Artifacts and Enchantments"></section>
    </div>

    <div id="actionsBox" aria-label="Game Actions"></div>
  </main>

  <footer>
    <button id="undoBtn" class="button" type="button">Undo Last Action</button>
    <button id="exportLogBtn" class="button" type="button">Export Log</button>
    <button id="resetGameBtn" class="button" type="button">Reset Game</button>
  </footer>

  <!-- Modal used for all numeric input, replacing window.prompt() -->
  <dialog id="numberDialog" class="game-dialog">
    <p id="numberDialogMessage"></p>
    <label for="numberDialogInput" class="sr-only">Value</label>
    <div class="stepper-row">
      <button type="button" class="button stepper-btn" id="numberDialogMinus" aria-label="Decrease">&minus;</button>
      <input type="number" id="numberDialogInput" />
      <button type="button" class="button stepper-btn" id="numberDialogPlus" aria-label="Increase">+</button>
    </div>
    <div class="dialog-buttons">
      <button type="button" class="button" id="numberDialogCancel">Cancel</button>
      <button type="button" class="button button-accent" id="numberDialogOk">OK</button>
    </div>
  </dialog>

  <!-- Modal used for all yes/no confirmations and one-button notices,
       replacing window.confirm() / window.alert(). -->
  <dialog id="confirmDialog" class="game-dialog">
    <p id="confirmDialogMessage"></p>
    <div class="dialog-buttons">
      <button type="button" class="button" id="confirmCancelBtn">Cancel</button>
      <button type="button" class="button button-accent" id="confirmOkBtn">Confirm</button>
    </div>
  </dialog>

  <!-- Choosing what an opponent's removal spell actually did to one of
       Voraxus's permanents: bounce (back to hand, recastable later) vs.
       gone for good (destroy/exile/sacrifice). -->
  <dialog id="removalDialog" class="game-dialog">
    <p id="removalDialogMessage"></p>
    <div class="dialog-buttons dialog-buttons-stacked">
      <button type="button" class="button button-accent" id="removalBounceBtn">Bounce to hand</button>
      <button type="button" class="button" id="removalDestroyBtn">Destroy / Exile</button>
      <button type="button" class="button" id="removalStunBtn">Add stun counter</button>
      <button type="button" class="button" id="removalCancelBtn">Cancel</button>
    </div>
  </dialog>

  <!-- Live in-battle stats: life over time and a running tally of which
       actions Voraxus has taken so far this game. -->
  <dialog id="statsDialog" class="game-dialog" aria-label="Battle Stats">
    <h2>Battle Stats</h2>
    <p id="statsCurrentLife"></p>
    <div id="statsSparkline"></div>
    <div id="statsTallyList"></div>
    <div class="dialog-buttons">
      <button type="button" class="button button-accent" id="statsCloseBtn">Close</button>
    </div>
  </dialog>

  <!-- For when an opponent's spell or ability gives Voraxus a creature
       directly (a Swan Song bird token, for example) rather than Voraxus
       summoning one of its own. -->
  <dialog id="giveCreatureDialog" class="game-dialog" aria-label="Give Voraxus a Creature">
    <h2>Give Voraxus a Creature</h2>
    <div class="form-row">
      <label for="giveCreaturePower">Power</label>
      <input type="number" id="giveCreaturePower" min="0" value="1" />
    </div>
    <div class="form-row">
      <label for="giveCreatureToughness">Toughness</label>
      <input type="number" id="giveCreatureToughness" min="0" value="1" />
    </div>
    <div class="form-row">
      <label for="giveCreatureAbility">Ability</label>
      <select id="giveCreatureAbility"></select>
    </div>
    <div class="form-row">
      <label for="giveCreatureType">Creature type (optional)</label>
      <input type="text" id="giveCreatureType" placeholder="e.g. Bird" />
    </div>
    <div class="dialog-buttons">
      <button type="button" class="button" id="giveCreatureCancel">Cancel</button>
      <button type="button" class="button button-accent" id="giveCreatureOk">Add Creature</button>
    </div>
  </dialog>

  <script>
    "use strict";

    const SAVE_KEY = "voraxusGameState";
    const SAVE_VERSION = 2; // bumped: save format now also stores the log
    const MAX_UNDO = 20;
    const MAX_LOG_ENTRIES = 300;

    /* ------------------------------------------------------------------
     *  Color schemes — Magic: The Gathering-flavored mystical palettes.
     *  Each overrides the same four CSS custom properties that the
     *  stylesheet's :root block defines, so switching is instant.
     * ---------------------------------------------------------------- */
    const THEME_STORAGE_KEY = "voraxusTheme";

    const THEMES = [
      {
        id: "wildwood",
        name: "Wildwood Sanctuary",   // the original sage-and-umber scheme
        bg: "#c9d6b3",
        text: "#3e2723",
        boxBg: "#fff3e0",
        buttonBg: "#d7ccc8",
        decoration: "vine", decorationColor: "#2f4a2e"
      },
      {
        id: "aetherial-plains",
        name: "Aetherial Plains",     // White mana
        bg: "#f5eeda",
        text: "#5c4a1e",
        boxBg: "#fffdf5",
        buttonBg: "#e6d6a8",
        decoration: "vine", decorationColor: "#a8862f"
      },
      {
        id: "tidewater-spire",
        name: "Tidewater Spire",      // Blue mana
        bg: "#cfe3f0",
        text: "#0e2a44",
        boxBg: "#eef8ff",
        buttonBg: "#a7c9de",
        decoration: "kelp", decorationColor: "#1a4a5c"
      },
      {
        id: "shadowfen",
        name: "Shadowfen",            // Black mana
        bg: "#211c26",
        text: "#e7ded2",
        boxBg: "#332b3a",
        buttonBg: "#4d4256",
        decoration: "thorn", decorationColor: "#5e5169"
      },
      {
        id: "emberforge",
        name: "Emberforge",           // Red mana
        bg: "#2b1414",
        text: "#f3e0c8",
        boxBg: "#3f1f1a",
        buttonBg: "#7a2e1e",
        decoration: "crack", decorationColor: "#c9622f"
      },
      {
        id: "mirrodin-steel",
        name: "Mirrodin Steel",       // Colorless / artifact
        bg: "#d4d8dc",
        text: "#22262b",
        boxBg: "#f2f4f6",
        buttonBg: "#a8b0b8",
        decoration: "crystal", decorationColor: "#6b747c"
      },
      {
        id: "nether-void",
        name: "Nether Void",          // Dimir (blue/black)
        bg: "#161a26",
        text: "#d8e2f0",
        boxBg: "#232a3d",
        buttonBg: "#33405c",
        decoration: "starwisp", decorationColor: "#a89bef"
      },
      {
        id: "sunforge-bastion",
        name: "Sunforge Bastion",     // Boros (red/white)
        bg: "#f2d9b8",
        text: "#5c1c14",
        boxBg: "#fff2df",
        buttonBg: "#e8a15a",
        decoration: "sand", decorationColor: "#b5793a"
      },
      {
        id: "everflow-marsh",
        name: "Everflow Marsh",       // Simic (green/blue)
        bg: "#bfe0d6",
        text: "#123b34",
        boxBg: "#eafaf4",
        buttonBg: "#7cc2ad",
        decoration: "moss", decorationColor: "#2d6459"
      },
      {
        id: "blood-moon-rite",
        name: "Blood Moon Rite",      // Rakdos (black/red)
        bg: "#1c1013",
        text: "#f0d9d2",
        boxBg: "#2e161b",
        buttonBg: "#6e1f2a",
        decoration: "blood", decorationColor: "#9c2b2b"
      }
    ];

    function applyTheme(themeId) {
      const theme = THEMES.find(t => t.id === themeId) || THEMES[0];
      const root = document.documentElement.style;
      root.setProperty("--bg-color", theme.bg);
      root.setProperty("--text-color", theme.text);
      root.setProperty("--box-bg", theme.boxBg);
      root.setProperty("--button-bg", theme.buttonBg);
      root.setProperty("--decoration-line-color", theme.decorationColor);

      try {
        localStorage.setItem(THEME_STORAGE_KEY, theme.id);
      } catch (err) {
        console.warn("Could not save color scheme:", err);
      }
    }

    function loadSavedThemeId() {
      try {
        const saved = localStorage.getItem(THEME_STORAGE_KEY);
        return THEMES.some(t => t.id === saved) ? saved : THEMES[0].id;
      } catch (err) {
        console.warn("Could not load saved color scheme:", err);
        return THEMES[0].id;
      }
    }

    function setUpThemePicker() {
      const select = document.getElementById("themeSelect");
      select.innerHTML = THEMES.map(t => `<option value="${t.id}">${t.name}</option>`).join("");

      const initialThemeId = loadSavedThemeId();
      select.value = initialThemeId;
      applyTheme(initialThemeId);

      select.onchange = () => applyTheme(select.value);
    }

    /* ------------------------------------------------------------------
     *  Chiptune background music — synthesized live with the Web Audio
     *  API, the same technique era-appropriate RPGs actually used (NES/
     *  Game Boy for the raw oscillators, SNES-era for the filtering and
     *  effects that follow). No audio files at all.
     *
     *  Each color has both a NOTE identity (COLOR_MUSIC_MOTIFS — a 4-bar
     *  phrase: tonic, subdominant, a bridge bar that introduces real
     *  tension, and a turnaround) and a VOICE identity (COLOR_VOICE_
     *  PROFILES — waveform, a resonant filter shaping that waveform into
     *  something closer to an SNES-JRPG lead/brass tone, and a touch of
     *  vibrato for a less static, more "played" feel). Voraxus's theme
     *  strings together each of its colors' full phrases in order, so a
     *  five-color Voraxus plays a genuine 20-bar suite before repeating.
     *
     *  Black specifically also carries a "dread" flag: a continuous low
     *  dissonant drone (root + minor 2nd + tritone) plays underneath its
     *  bars, heavily reverbed, plus an occasional random unsettling
     *  metallic stinger — aiming at the same register as Castlevania's
     *  gothic minor-key dread or Blasphemous's dark ambience, rather than
     *  a cheerful chiptune loop. A separate slow, gentle theme plays
     *  before the colors are even chosen (the config/resume screen).
     * ---------------------------------------------------------------- */
    const MUSIC_STORAGE_KEY = "voraxusMusicOn";
    const VOLUME_STORAGE_KEY = "voraxusMusicVolume";
    const SCHEDULE_AHEAD = 0.12;   // how far ahead (seconds) to schedule notes
    const SCHEDULER_INTERVAL = 25; // how often (ms) the scheduler wakes up

    /* Each color's own timbre: waveform plus a lowpass filter (cutoff +
       resonance) that shapes the raw wave into something closer to a
       character-appropriate synth voice, a touch of vibrato (rate in Hz,
       depth in cents) for a less static tone, the interval the second
       lead plays above the melody, and whether this color's bars carry
       the dark-ambient drone/stinger treatment. */
    const COLOR_VOICE_PROFILES = {
      White: { waveform: "square", leadGain: 0.05, filterCutoff: 3400, filterQ: 0.8, vibratoRate: 5, vibratoCents: 3, harmonyInterval: 4, dread: false },
      Blue: { waveform: "triangle", leadGain: 0.045, filterCutoff: 2100, filterQ: 1.8, vibratoRate: 4.5, vibratoCents: 6, harmonyInterval: 7, dread: false },
      Black: { waveform: "sawtooth", leadGain: 0.045, filterCutoff: 1300, filterQ: 3.5, vibratoRate: 4, vibratoCents: 9, harmonyInterval: 3, dread: true },
      Red: { waveform: "sawtooth", leadGain: 0.055, filterCutoff: 2800, filterQ: 2.5, vibratoRate: 6.5, vibratoCents: 3, harmonyInterval: 4, dread: false },
      Green: { waveform: "triangle", leadGain: 0.05, filterCutoff: 1900, filterQ: 1.2, vibratoRate: 4, vibratoCents: 5, harmonyInterval: 7, dread: false }
    };

    /* Each color's 7-bar phrase: tonic, subdominant/relative, a secondary
       chord, a relative-key shift, a bridge bar with real harmonic
       tension, a climax (the phrase's dynamic/registral peak), and a
       turnaround back to the top. Seven bars guarantees a real musical
       arc — seven genuinely different movements — even for a mono-
       colored Voraxus; a multicolor one just gets more (14 for two
       colors, 35 for five). Unlike a fixed arpeggio grid, `melody` is a
       short list of actual note events — { step, note, len } meaning
       "starting at eighth-note step N (0–7), play this note for `len`
       eighth-notes." Steps with no event are silence. That's what lets a
       bar hold a long note, leave a rest for phrasing, or land a note
       off the beat. MIDI note numbers throughout. */
    const COLOR_MUSIC_MOTIFS = {
      White: [ // bright, FF-town-theme rise-and-rest phrasing
        { bass: 48, bassGain: 0.08, melody: [{ step: 0, note: 72, len: 2 }, { step: 2, note: 76, len: 1 }, { step: 3, note: 79, len: 1 }, { step: 4, note: 76, len: 2 }, { step: 6, note: 72, len: 2 }] }, // I
        { bass: 53, bassGain: 0.08, melody: [{ step: 0, note: 77, len: 1 }, { step: 1, note: 74, len: 1 }, { step: 2, note: 72, len: 2 }, { step: 4, note: 69, len: 2 }, { step: 6, note: 72, len: 2 }] }, // IV
        { bass: 50, bassGain: 0.08, melody: [{ step: 0, note: 74, len: 1 }, { step: 1, note: 77, len: 2 }, { step: 3, note: 74, len: 1 }, { step: 4, note: 79, len: 2 }, { step: 6, note: 76, len: 2 }] }, // ii
        { bass: 52, bassGain: 0.08, melody: [{ step: 0, note: 76, len: 2 }, { step: 2, note: 79, len: 1 }, { step: 3, note: 83, len: 1 }, { step: 4, note: 79, len: 2 }, { step: 6, note: 74, len: 2 }] }, // iii, relative shift
        { bass: 45, bassGain: 0.08, melody: [{ step: 0, note: 69, len: 1 }, { step: 2, note: 76, len: 2 }, { step: 4, note: 81, len: 1 }, { step: 6, note: 79, len: 2 }] }, // vi, bridge: syncopated leap
        { bass: 48, bassGain: 0.08, melody: [{ step: 0, note: 81, len: 3 }, { step: 4, note: 84, len: 1 }, { step: 5, note: 81, len: 1 }, { step: 6, note: 79, len: 2 }] }, // I pedal, climax — the phrase's high point
        { bass: 55, bassGain: 0.08, melody: [{ step: 0, note: 74, len: 2 }, { step: 2, note: 71, len: 1 }, { step: 3, note: 67, len: 1 }, { step: 4, note: 71, len: 2 }, { step: 6, note: 62, len: 2 }] }, // V, turnaround
        { bass: 47, bassGain: 0.08, melody: [{ step: 0, note: 71, len: 2 }, { step: 2, note: 74, len: 1 }, { step: 3, note: 77, len: 1 }, { step: 4, note: 74, len: 2 }, { step: 6, note: 71, len: 2 }] }, // vii°, extra variety for the shuffle pool
        { bass: 55, bassGain: 0.08, melody: [{ step: 0, note: 79, len: 1 }, { step: 1, note: 76, len: 1 }, { step: 2, note: 74, len: 2 }, { step: 4, note: 72, len: 2 }, { step: 6, note: 67, len: 2 }] }, // V, alternate contour
        { bass: 50, bassGain: 0.08, melody: [{ step: 0, note: 74, len: 2 }, { step: 2, note: 77, len: 1 }, { step: 3, note: 81, len: 1 }, { step: 4, note: 77, len: 2 }, { step: 6, note: 72, len: 2 }] } // ii, alternate contour
      ],
      Blue: [ // sparse, wide intervals, generous rests — Metroid isolation
        { bass: 45, bassGain: 0.08, melody: [{ step: 0, note: 69, len: 3 }, { step: 4, note: 76, len: 3 }] }, // i
        { bass: 43, bassGain: 0.08, melody: [{ step: 0, note: 67, len: 2 }, { step: 3, note: 74, len: 2 }, { step: 6, note: 71, len: 2 }] }, // bVII
        { bass: 47, bassGain: 0.08, melody: [{ step: 0, note: 71, len: 3 }, { step: 4, note: 77, len: 3 }] }, // ii-half-dim, secondary
        { bass: 52, bassGain: 0.08, melody: [{ step: 0, note: 64, len: 2 }, { step: 3, note: 71, len: 2 }, { step: 6, note: 76, len: 2 }] }, // v, relative shift
        { bass: 51, bassGain: 0.08, melody: [{ step: 0, note: 63, len: 2 }, { step: 3, note: 70, len: 3 }] }, // bridge: distant, tritone-away
        { bass: 45, bassGain: 0.08, melody: [{ step: 0, note: 81, len: 6 }] }, // low pedal under one long held high note — climax through stillness, not volume
        { bass: 50, bassGain: 0.08, melody: [{ step: 0, note: 62, len: 2 }, { step: 3, note: 69, len: 2 }, { step: 6, note: 74, len: 2 }] }, // IV, turnaround
        { bass: 48, bassGain: 0.08, melody: [{ step: 0, note: 72, len: 3 }, { step: 4, note: 79, len: 3 }] }, // bIII, extra variety for the shuffle pool
        { bass: 41, bassGain: 0.08, melody: [{ step: 0, note: 65, len: 2 }, { step: 3, note: 72, len: 2 }, { step: 6, note: 77, len: 2 }] }, // bVI
        { bass: 45, bassGain: 0.08, melody: [{ step: 0, note: 72, len: 2 }, { step: 3, note: 69, len: 2 }, { step: 6, note: 64, len: 2 }] } // i, alternate contour

    /** Fisher-Yates shuffle — returns a new shuffled copy, doesn't
        mutate the input. */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    /** Builds a long, non-obviously-repeating playback sequence from a
        bar pool: each "lap" is a fresh independent shuffle of the whole
        pool (so every bar still comes up equally often overall, just in
        a different order each time), stitched together so the exact
        sequence doesn't repeat for many laps — and a small check at each
        seam stops the same bar from playing twice in a row when one lap
        ends and the next begins. This is what actually solves "it loops
        too fast": rather than composing an enormous amount of new raw
        material, a modest pool (10 bars) replayed in a long, shuffled
        order takes several minutes for its EXACT sequence to repeat,
        even though any individual bar is heard again well before that. */
    function buildShuffledSequence(pool, laps) {
      if (!pool || pool.length === 0) return [];
      const sequence = [];
      let lastBar = null;
      for (let lap = 0; lap < laps; lap++) {
        const shuffled = shuffleArray(pool);
        if (pool.length > 1 && shuffled[0] === lastBar) {
          [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
        }
        sequence.push(...shuffled);
        lastBar = shuffled[shuffled.length - 1];
      }
      return sequence;
    }

    // generate. At 140 BPM, one bar is ~1.71 seconds, so 5 laps of a
    // 10-bar pool is 50 bars — about 86 seconds — before a mono-colored
    // Voraxus's exact sequence repeats; a two-color Voraxus, with two
    // independently-shuffled 50-bar blocks back to back, stretches to
    // nearly 3 minutes.
    const SHUFFLE_LAPS_PER_COLOR = 5;

    /** Assembles a theme for Voraxus's actual color set: each color
        contributes its own long, freshly-shuffled sequence built from
        its 10-bar pool (see buildShuffledSequence above), concatenated
        color by color — so colors still arrive as their own coherent
        "movement" with their own instrument voice, rather than being
        interleaved with each other, but within a color's own block the
        bars no longer play in the same fixed order lap after lap. Each
        bar is tagged with that color's full voice profile (waveform,
        filter, vibrato, harmony interval, dread flag), so the instrument
        itself changes character color to color, not just the notes. */

      if (!colors || colors.length === 0 || colors[0] === "Colorless") {

        const profile = COLOR_VOICE_PROFILES[c] || {};
        const pool = (COLOR_MUSIC_MOTIFS[c] || []).map(bar => ({ ...bar, ...profile }));
        return buildShuffledSequence(pool, SHUFFLE_LAPS_PER_COLOR);
      });
      return { bpm: 140, bars: bars.length ? bars : buildColorlessTrack().bars };
    }

        Voraxus — builds a fresh shuffled sequence from COLORLESS_TRACK's
        own bar pool each time, rather than replaying that fixed 7-bar
        array in the same order every loop. */
    function buildColorlessTrack() {
      return { bpm: COLORLESS_TRACK.bpm, bars: buildShuffledSequence(COLORLESS_TRACK.bars, SHUFFLE_LAPS_PER_COLOR) };

    let delayInput = null;

    let delayFeedbackL = null;
    let delayFeedbackR = null;
