    /** Builds a synthetic reverb impulse response — exponentially-decaying
        white noise — entirely in code. No external audio file needed, so
        it costs nothing to load and works the same on every device. */
    function createReverbImpulse(ctx, duration, decay) {
      const rate = ctx.sampleRate;
      const length = Math.floor(rate * duration);
      const impulse = ctx.createBuffer(2, length, rate);
      for (let channel = 0; channel < 2; channel++) {
        const data = impulse.getChannelData(channel);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }
      return impulse;
    }

    function createNoiseBuffer(ctx, duration) {
      const length = Math.floor(ctx.sampleRate * duration);
      const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < length; i++) {
        data[i] = Math.random() * 2 - 1;
      }
      return buffer;
    }

    /** Connects a finished voice (post its own gain envelope) to the
        speakers, plus however much of the delay and reverb sends it asks
        for. Every voice always gets its full dry signal; delayAmt/
        reverbAmt (0–1ish) control how much of a wet copy joins it — a
        punchy kick asks for almost none, an atmospheric pad or drone asks
        for a lot, so different instruments can sit at different
        "distances" in the same mix. */
    /** Connects a finished voice (post its own gain envelope) to the
        speakers, plus however much of the delay and reverb sends it asks
        for, at whatever stereo position `pan` (-1 full left, 0 center,
        +1 full right) puts it. Every voice always gets its full dry
        signal; delayAmt/reverbAmt (0–1ish) control how much of a wet
        copy joins it — a punchy kick asks for almost none, an
        atmospheric pad or drone asks for a lot. Panning happens BEFORE
        the wet sends, so a voice's echo/reverb tail keeps its position
        too instead of collapsing back to the center. */
    function connectWithSends(sourceNode, delayAmt, reverbAmt, pan) {
      let output = sourceNode;
      if (pan) {
        const panner = audioCtx.createStereoPanner();
        panner.pan.value = Math.max(-1, Math.min(1, pan));
        sourceNode.connect(panner);
        output = panner;
      }
      output.connect(masterGain);
      if (delayAmt) {
        const send = audioCtx.createGain();
        send.gain.value = delayAmt;
        output.connect(send);
        send.connect(delayInput);
      }
      if (reverbAmt) {
        const send = audioCtx.createGain();
        send.gain.value = reverbAmt;
        output.connect(send);
        send.connect(reverbNode);
      }
    }

    /**
     * Plays one note. `tone` (all optional) is what turns a raw oscillator
     * into a color-specific "instrument":
     *   - filterCutoff/filterQ: a resonant lowpass, the classic trick for
     *     shaping a harsh raw square/sawtooth into something closer to an
     *     SNES-era synth brass or lead tone instead of a flat beep.
     *   - vibratoRate/vibratoCents: a second, silent oscillator (an LFO)
     *     wobbling this note's pitch slightly — the single biggest thing
     *     that makes a synth voice sound "played" instead of static.
     *   - pan/delaySend/reverbSend: where in stereo space, and how far
     *     into the mix's "depth", this particular note sits.
     */
    function playChiptuneNote(waveform, freq, startTime, duration, peakGain, tone) {
      tone = tone || {};
      const osc = audioCtx.createOscillator();
      osc.type = waveform;
      osc.frequency.setValueAtTime(freq, startTime);

      let outputNode = osc;
      if (tone.filterCutoff) {
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = tone.filterCutoff;
        filter.Q.value = tone.filterQ || 1;
        osc.connect(filter);
        outputNode = filter;
      }

      if (tone.vibratoRate && tone.vibratoCents) {
        const lfo = audioCtx.createOscillator();
        lfo.type = "sine";
        lfo.frequency.value = tone.vibratoRate;
        const lfoDepth = audioCtx.createGain();
        // Convert a "cents" depth into the Hz swing appropriate for this
        // note's own frequency, so the wobble is proportionally the same
        // size on a low note as on a high one.
        lfoDepth.gain.value = freq * (Math.pow(2, tone.vibratoCents / 1200) - 1);
        lfo.connect(lfoDepth).connect(osc.frequency);
        lfo.start(startTime);
        lfo.stop(startTime + duration + 0.05);
      }

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
      outputNode.connect(gain);
      connectWithSends(gain, tone.delaySend || 0, tone.reverbSend || 0, tone.pan || 0);

      osc.start(startTime);
      osc.stop(startTime + duration + 0.03);
    }

    /** A soft background pad: slow fade in/out (unlike the lead/bass's
        quick pluck) and two slightly-detuned sine oscillators, panned to
        opposite sides of the stereo field, for a wide, airy chorus-like
        spread rather than a single point-source tone. */
    function playPadNote(freq, startTime, duration, peakGain) {
      [[-4, -0.6], [4, 0.6]].forEach(([detuneCents, pan]) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * Math.pow(2, detuneCents / 1200), startTime);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(peakGain, startTime + 0.4);
        gain.gain.setValueAtTime(peakGain, Math.max(startTime + 0.41, startTime + duration - 0.35));
        gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(gain);
        connectWithSends(gain, 0.11, 0.30, pan);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.1);
      });
    }

    /** A continuous dissonant undertone for Black's "dread" bars: root,
        minor 2nd, and tritone — three of the most unsettled intervals in
        Western harmony — as detuned sawtooths tamed by a dark lowpass
        filter into a low hum rather than a harsh buzz, spread wide across
        the stereo field and drenched in reverb. This is the Castlevania/
        Blasphemous/dark-ambient layer: it only plays under bars from a
        color that asks for it. */
    function playDroneNote(rootMidi, startTime, duration, peakGain) {
      [[0, -0.55], [1, 0], [6, 0.55]].forEach(([interval, pan], i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(midiToFreq(rootMidi + interval), startTime);
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 460;
        filter.Q.value = 1;
        const gain = audioCtx.createGain();
        const p = peakGain / (i + 1.6);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(p, startTime + 0.6);
        gain.gain.setValueAtTime(p, startTime + duration - 0.5);
        gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);
        osc.connect(filter).connect(gain);
        connectWithSends(gain, 0.10, 0.55, pan);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.1);
      });
    }

    /** A random, infrequent, unsettling metallic "toll" — a detuned
        cluster (root, tritone, octave) with a sharp attack and a long,
        uneven decay, sent almost entirely to reverb, and placed at a
        random stereo position each time so it feels like it's coming
        from somewhere different every time — the way a horror game
        scores an unpredictable ambient event. Only fires under Black. */
    function playDreadStinger(startTime) {
      const rootMidi = 28 + randomInt(13);
      const stingerPan = (Math.random() * 1.4) - 0.7;
      [0, 6, 12].forEach((interval, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(midiToFreq(rootMidi + interval), startTime);
        const gain = audioCtx.createGain();
        const p = 0.045 / (i + 1);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(p, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0004, startTime + 2.0 + i * 0.3);
        osc.connect(gain);
        connectWithSends(gain, 0.14, 0.6, stingerPan);
        osc.start(startTime);
        osc.stop(startTime + 2.6);
      });
    }

    /** A short synthesized kick: a sine oscillator that drops in pitch
        very quickly, the classic cheap-and-effective drum-machine kick.
        Kept dead-center, like a real drum mix. */
    function playKick(startTime) {
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(155, startTime);
      osc.frequency.exponentialRampToValueAtTime(46, startTime + 0.12);
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.22, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0008, startTime + 0.16);
      osc.connect(gain);
      connectWithSends(gain, 0, 0.09, 0);
      osc.start(startTime);
      osc.stop(startTime + 0.17);
    }

    /** A short burst of high-passed noise for a hi-hat "tss". Reuses one
        shared noise buffer (generated once) instead of allocating a new
        buffer per hit. Sits slightly off-center, like a real hi-hat. */
    function playHiHat(startTime) {
      const noise = audioCtx.createBufferSource();
      noise.buffer = hiHatNoiseBuffer;
      const filter = audioCtx.createBiquadFilter();
      filter.type = "highpass";
      filter.frequency.value = 6500;
      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.06, startTime);
      gain.gain.exponentialRampToValueAtTime(0.0005, startTime + 0.045);
      noise.connect(filter).connect(gain);
      connectWithSends(gain, 0, 0.07, 0.3);
      noise.start(startTime);
      noise.stop(startTime + 0.05);
    }

    /** A short, aggressive synthesized growl — plays immediately (not on
        the musical grid) whenever Voraxus does anything other than
        nothing. Two detuned low sawtooths sliding down in pitch give the
        rough, beating core; a burst of low-passed noise underneath adds
        breath/texture. Only plays if music is actively enabled, since
        this is a sound effect layered onto the existing audio graph
        rather than an independent system — muting music mutes this too,
        same as it would for anything else audio-related. */
    function playMonsterRoar() {
      if (!audioCtx || !musicEnabled) return;
      const now = audioCtx.currentTime;
      const pan = (Math.random() * 0.6) - 0.3;

      [0, -9].forEach((detune, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sawtooth";
        const startFreq = 90 + randomInt(20);
        osc.frequency.setValueAtTime(startFreq, now);
        osc.frequency.exponentialRampToValueAtTime(startFreq * 0.55, now + 0.22);
        osc.detune.setValueAtTime(detune, now);

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(1400, now);
        filter.frequency.exponentialRampToValueAtTime(400, now + 0.3);
        filter.Q.value = 3;

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0, now);
        gain.gain.linearRampToValueAtTime(0.11 / (i + 1), now + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0006, now + 0.4);

        osc.connect(filter).connect(gain);
        connectWithSends(gain, 0.08, 0.25, pan);
        osc.start(now);
        osc.stop(now + 0.42);
      });

      const noise = audioCtx.createBufferSource();
      noise.buffer = hiHatNoiseBuffer;
      const noiseFilter = audioCtx.createBiquadFilter();
      noiseFilter.type = "lowpass";
      noiseFilter.frequency.value = 900;
      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.05, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.0006, now + 0.22);
      noise.connect(noiseFilter).connect(noiseGain);
      connectWithSends(noiseGain, 0, 0.2, pan);
      noise.start(now);
      noise.stop(now + 0.22);
    }

    /** Briefly shakes the whole page — the visual half of the "Voraxus
        did something" feedback, paired with playMonsterRoar() but not
        dependent on audio being enabled at all (this fires regardless of
        the music toggle). Removes and re-adds its own class first so a
        shake retriggers cleanly even if the previous one hasn't finished
        (a plain re-add wouldn't restart an already-running animation).
        Respects prefers-reduced-motion via the CSS rule itself. */
    function triggerScreenShake() {
      document.body.classList.remove("voraxus-shake-active");
      void document.body.offsetWidth;
      document.body.classList.add("voraxus-shake-active");
    }

    /** Briefly flashes a large silhouette of whatever just entered the
        battlefield across the middle of the screen, tinted to the
        creature's own colour. Reuses the same icon the creature card
        shows, so the thing that flashes is literally the thing that was
        summoned. Purely decorative: it sits behind nothing, ignores
        pointer events, and removes itself when the animation ends.
        Skipped entirely under prefers-reduced-motion, same as the
        screen shake. */
    function flashCreature(iconId, colors) {
      if (typeof window.matchMedia === "function" &&
          window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        return;
      }
      const overlay = document.createElement("div");
      overlay.className = "creature-flash";
      overlay.setAttribute("aria-hidden", "true");
      const tint = COLOR_MAP[(colors && colors[0]) || "Colorless"] || "#999999";
      overlay.style.color = tint;
      overlay.innerHTML = getCreatureIconSVG(iconId);
      document.body.appendChild(overlay);
      // Clean up whether or not the animation event fires (it won't if
      // the element is removed early or animations are disabled).
      const remove = () => { if (overlay.parentNode) overlay.parentNode.removeChild(overlay); };
      overlay.addEventListener("animationend", remove);
      setTimeout(remove, 1200);
    }

    /** A steady triangle-wave arpeggio (root, third, fifth, third — one
        octave above the bass) ticking on every eighth-note, quiet and
        panned opposite the melody. This is what actually breaks up "just
        the melody repeating": a second, continuously-moving rhythmic
        layer with its own independent pattern underneath it. */
    function playArpeggioNote(freq, startTime, duration, peakGain) {
      const tone = { filterCutoff: 2600, filterQ: 0.7, delaySend: 0.07, reverbSend: 0.1, pan: -0.55 };
      playChiptuneNote("triangle", freq, startTime, duration, peakGain, tone);
    }

    /** A slow-breathing background texture: a sine tone run through a
        lowpass filter whose cutoff is itself modulated by a second, very
        slow oscillator (an LFO) — the filter "opens" and "closes" over
        several seconds, which reads as a gentle swell/pulse rather than a
        static tone. This is the explicit LFO instrument: subtle, wide,
        and mixed low so it's felt more than consciously heard. */
    function playLfoSwell(freq, startTime, duration, peakGain) {
      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);

      const filter = audioCtx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 700;
      filter.Q.value = 1.8;

      const lfo = audioCtx.createOscillator();
      lfo.type = "sine";
      lfo.frequency.value = 0.15; // one full "breath" roughly every 6-7 seconds
      const lfoDepth = audioCtx.createGain();
      lfoDepth.gain.value = 480; // how far the filter cutoff swings, in Hz
      lfo.connect(lfoDepth).connect(filter.frequency);
      lfo.start(startTime);
      lfo.stop(startTime + duration + 0.1);

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0, startTime);
      gain.gain.linearRampToValueAtTime(peakGain, startTime + duration * 0.4);
      gain.gain.linearRampToValueAtTime(0.0001, startTime + duration);
      osc.connect(filter).connect(gain);
      connectWithSends(gain, 0.1, 0.4, 0);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.1);
    }

    /** A small sparkle of inharmonic sine partials (bells and other
        struck-metal sounds have overtones that AREN'T neat whole-number
        multiples of the root, which is what makes them sound bell-like
        instead of flute-like) — an occasional bright accent once the
        arrangement is fully built up. */
    function playBellChime(freq, startTime) {
      [1, 2.4, 3.8].forEach((mult, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.setValueAtTime(freq * mult, startTime);
        const gain = audioCtx.createGain();
        const peak = 0.032 / (i + 1);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(peak, startTime + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0004, startTime + 1.3);
        osc.connect(gain);
        connectWithSends(gain, 0.12, 0.35, i % 2 === 0 ? 0.25 : -0.25);
        osc.start(startTime);
        osc.stop(startTime + 1.4);
      });
    }

    /** Switches the active theme. Takes effect immediately if music is
        already playing (at the next scheduled step); otherwise it's just
        remembered for whenever the player next taps "Music: On". */
    function setMusicTrack(track) {
      currentTrack = track;
      secondsPerBeat = 60 / currentTrack.bpm;
      eighthNote = secondsPerBeat / 2;
      barIndex = 0;
      stepIndex = 0;
      loopPassCount = 0;
    }

    function scheduleChiptuneStep(time) {
      const bar = currentTrack.bars[barIndex % currentTrack.bars.length];

      // How this bar's lead/harmony notes sit in stereo space and in the
      // delay/reverb — dread bars sit further back and wider, everything
      // else stays comparatively present, punchy, and just left-of-center
      // (the harmony lead takes the right side, so the two leads are
      // genuinely spatially separated, not stacked on top of each other).
      const tone = {
        filterCutoff: bar.filterCutoff,
        filterQ: bar.filterQ,
        vibratoRate: bar.vibratoRate,
        vibratoCents: bar.vibratoCents,
        delaySend: bar.dread ? 0.20 : 0.09,
        reverbSend: bar.dread ? 0.38 : 0.13,
        pan: -0.18
      };

      // The arrangement builds up the more times the theme has looped —
      // lead+bass+pad, then harmony, then a steady arpeggio layer, then
      // drums, then a slow LFO-modulated ambient swell, then occasional
      // bell accents — six stages taking a bare 3-instrument opening up
      // to a full 9-instrument arrangement, so the piece keeps developing
      // rather than sounding identical every time through. Capped at 5 so
      // it settles into its full arrangement rather than growing forever.
      const arrangementLevel = Math.min(loopPassCount, 5);

      // Real composed melody: a short list of { step, note, len } events
      // rather than one value per grid slot, so notes can hold, rest, or
      // land off the beat — this is what actually stops it sounding like
      // a mechanical arpeggio.
      const event = (bar.melody || []).find(e => e.step === stepIndex);
      if (event) {
        const noteDuration = event.len * eighthNote;
        playChiptuneNote(bar.waveform, midiToFreq(event.note), time, noteDuration * 0.92, bar.leadGain, tone);

        if (arrangementLevel >= 1) {
          const harmonyWaveform = bar.waveform === "triangle" ? "square" : "triangle";
          const interval = bar.harmonyInterval != null ? bar.harmonyInterval : 4;
          const harmonyTone = { ...tone, pan: 0.35 };
          playChiptuneNote(harmonyWaveform, midiToFreq(event.note + interval), time, noteDuration * 0.92, bar.leadGain * 0.6, harmonyTone);
        }
      }

      // Arpeggio accompaniment: a steady, independently-moving eighth-note
      // pattern (root-third-fifth-third, an octave above the bass) — a
      // second rhythmic identity underneath the melody's own, sparser one.
      if (arrangementLevel >= 2 && bar.bass != null) {
        const arpRoot = bar.bass + 12;
        const arpInterval = bar.harmonyInterval != null ? bar.harmonyInterval : 4;
        const arpPattern = [arpRoot, arpRoot + arpInterval, arpRoot + 7, arpRoot + arpInterval];
        const arpNote = arpPattern[stepIndex % arpPattern.length];
        playArpeggioNote(midiToFreq(arpNote), time, eighthNote * 0.85, bar.leadGain * 0.26);
      }

      if (arrangementLevel >= 3) {
        if (stepIndex === 0 || stepIndex === 4) {
          playKick(time);
        } else {
          playHiHat(time);
        }
      }

      if (stepIndex === 0 && bar.bass != null) {
        const barDuration = secondsPerBeat * 4;
        playChiptuneNote("triangle", midiToFreq(bar.bass), time, barDuration * 0.95, bar.bassGain, { pan: 0, delaySend: 0.05, reverbSend: 0.12 });

        // Pad: a soft root + fifth drone, one octave above the bass,
        // sustained for the whole bar, spread wide in stereo.
        const padGain = (bar.bassGain || 0.08) * 0.34;
        playPadNote(midiToFreq(bar.bass + 12), time, barDuration, padGain);
        playPadNote(midiToFreq(bar.bass + 19), time, barDuration, padGain * 0.78);

        // LFO-modulated ambient swell: a slow breathing texture sitting
        // underneath everything else, present for every theme (not just
        // Black's dread layer) once the arrangement is mostly built up.
        if (arrangementLevel >= 4) {
          playLfoSwell(midiToFreq(bar.bass + 24), time, barDuration, 0.032);
        }

        // Bell/chime accent: a bright, occasional sparkle once the
        // arrangement has fully built up — only on alternating bars so it
        // reads as a rare accent, not a constant chime.
        if (arrangementLevel >= 5 && barIndex % 2 === 0) {
          playBellChime(midiToFreq(bar.bass + 24 + (bar.harmonyInterval != null ? bar.harmonyInterval : 4)), time);
        }

        // Dark-ambient layer: a continuous dissonant drone, plus a
        // roughly 1-in-5 chance per bar of a random unsettling stinger —
        // both only for colors that ask for this treatment (Black).
        if (bar.dread) {
          playDroneNote(bar.bass - 12, time, barDuration, 0.038);
          if (Math.random() < 0.22) {
            playDreadStinger(time + Math.random() * eighthNote * 3);
          }
        }
      }
    }

    function chiptuneSchedulerTick() {
      while (nextNoteTime < audioCtx.currentTime + SCHEDULE_AHEAD) {
        scheduleChiptuneStep(nextNoteTime);
        nextNoteTime += eighthNote;
        stepIndex++;
        if (stepIndex >= 8) {
          stepIndex = 0;
          barIndex++;
          if (barIndex >= currentTrack.bars.length) {
            barIndex = 0;
            loopPassCount++;
          }
        }
      }
      schedulerTimerId = setTimeout(chiptuneSchedulerTick, SCHEDULER_INTERVAL);
    }

    function startMusic() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return; // Web Audio unsupported; silently no-op
        audioCtx = new AudioContextClass();

        // Final bus: everything (dry mix + both effect returns) passes
        // through one compressor before the speakers. That's what lets
        // the whole mix run louder without harsh digital clipping — it
        // automatically reins in the loudest instants instead of every
        // voice having to individually stay conservative — and a gentle
        // compressor also just glues a mix together, which is part of
        // what makes a track feel "produced" instead of several separate
        // sounds happening to play at once.
        compressorNode = audioCtx.createDynamicsCompressor();
        compressorNode.threshold.value = -18;
        compressorNode.knee.value = 24;
        compressorNode.ratio.value = 4;
        compressorNode.attack.value = 0.003;
        compressorNode.release.value = 0.18;
        compressorNode.connect(audioCtx.destination);

        masterGain = audioCtx.createGain();
        masterGain.gain.value = volumePercentToGain(loadVolumePreference());
        masterGain.connect(compressorNode);

        // Stereo ping-pong delay: instead of one mono echo repeating in
        // place, the signal bounces left, then right, then left again
        // (each time a little quieter), which reads as actual space
        // between the speakers rather than a flat repeat — a real,
        // audible sense of depth instead of everything sitting in the
        // same spot. delayInput is the single entry point every voice's
        // send feeds into; the two delay lines cross-feed each other to
        // create the bounce.
        delayInput = audioCtx.createGain();
        delayInput.gain.value = 1.0;

        delayNodeL = audioCtx.createDelay(1.0);
        delayNodeL.delayTime.value = 0.26;
        delayNodeR = audioCtx.createDelay(1.0);
        delayNodeR.delayTime.value = 0.39; // slightly different from L so the bounce isn't perfectly even/robotic

        delayFeedbackL = audioCtx.createGain();
        delayFeedbackL.gain.value = 0.44;
        delayFeedbackR = audioCtx.createGain();
        delayFeedbackR.gain.value = 0.44;

        const delayPanL = audioCtx.createStereoPanner();
        delayPanL.pan.value = -0.85;
        const delayPanR = audioCtx.createStereoPanner();
        delayPanR.pan.value = 0.85;

        delayInput.connect(delayNodeL);
        delayNodeL.connect(delayFeedbackL);
        delayFeedbackL.connect(delayNodeR); // L bounces to R
        delayNodeR.connect(delayFeedbackR);
        delayFeedbackR.connect(delayNodeL); // R bounces back to L

        delayNodeL.connect(delayPanL);
        delayPanL.connect(compressorNode);
        delayNodeR.connect(delayPanR);
        delayPanR.connect(compressorNode);

        // Reverb bus: a synthesized impulse response (no audio file).
        // Same per-voice-send model as the delay bus above.
        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createReverbImpulse(audioCtx, 2.2, 3.2);
        reverbWetGain = audioCtx.createGain();
        reverbWetGain.gain.value = 0.9;
        reverbNode.connect(reverbWetGain);
        reverbWetGain.connect(compressorNode);

        hiHatNoiseBuffer = createNoiseBuffer(audioCtx, 1.0);
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      barIndex = 0;
      stepIndex = 0;
      loopPassCount = 0;
      nextNoteTime = audioCtx.currentTime + 0.1;
      chiptuneSchedulerTick();
      musicEnabled = true;
    }

    function stopMusic() {
      musicEnabled = false;
      if (schedulerTimerId) {
        clearTimeout(schedulerTimerId);
        schedulerTimerId = null;
      }
    }

    function saveMusicPreference(on) {
      try {
        localStorage.setItem(MUSIC_STORAGE_KEY, on ? "1" : "0");
      } catch (err) {
        console.warn("Could not save music preference:", err);
      }
    }

    function loadMusicPreference() {
      try {
        return localStorage.getItem(MUSIC_STORAGE_KEY) === "1";
      } catch (err) {
        return false;
      }
    }

    function saveVolumePreference(percent) {
      try {
        localStorage.setItem(VOLUME_STORAGE_KEY, String(percent));
      } catch (err) {
        console.warn("Could not save volume preference:", err);
      }
    }

    function loadVolumePreference() {
      try {
        const raw = parseInt(localStorage.getItem(VOLUME_STORAGE_KEY), 10);
        return Number.isInteger(raw) && raw >= 0 && raw <= 100 ? raw : 80;
      } catch (err) {
        return 80;
      }
    }

    /** Converts a 0-100 slider position to the actual gain value applied
        to masterGain. 80 (the default) lands on 1.6 — the loudness this
        whole mix was originally tuned at — so turning the slider up from
        its default genuinely goes louder than "normal" rather than the
        default already being maxed out. */
    function volumePercentToGain(percent) {
      return (percent / 100) * 2.0;
    }

    /** Wires up the music toggle button. Playback always starts paused —
        browsers block audio until a real user gesture, so even if the
        player left music on last time, this waits for their first tap. */
    function setUpMusicToggle() {
      const musicBtn = document.getElementById("musicToggleBtn");
      const wantsMusic = loadMusicPreference();
      musicBtn.textContent = wantsMusic ? "\u{1F3B5} Tap" : "\u{1F3B5} Off";

      musicBtn.onclick = () => {
        if (musicEnabled) {
          stopMusic();
          musicBtn.textContent = "\u{1F3B5} Off";
          saveMusicPreference(false);
        } else {
          startMusic();
          musicBtn.textContent = "\u{1F3B5} On";
          saveMusicPreference(true);
        }
      };
    }

    /** Wires up the volume slider. Applies live if music is already
        playing (masterGain exists once startMusic() has run at least
        once); otherwise just remembers the preference for startMusic()
        to read when it first creates masterGain. */
    function setUpVolumeSlider() {
      const slider = document.getElementById("musicVolumeSlider");
      slider.value = String(loadVolumePreference());

      slider.oninput = () => {
        const percent = parseInt(slider.value, 10);
        saveVolumePreference(percent);
        if (masterGain) {
          masterGain.gain.value = volumePercentToGain(percent);
        }
      };
    }

    /* ------------------------------------------------------------------
     *  Global game state
     * ---------------------------------------------------------------- */
    const gameState = {
      numPlayers: 1,
      difficultyMode: 1,
      botName: "Voraxus",
      voraxusLife: 20,
      voraxusCards: 7,
      voraxusLibrary: 100,
      voraxusTotalMana: 0,
      voraxusCurrentMana: 0,
      voraxusCreatureCount: 0,
      isVoraxusTurn: false,
      creatures: [],
      artifactsAndEnchantments: [],
      bouncedCards: [],
      commander: null,
      maxHandSizeOverride: null,
      voraxusColors: [],
      lifeHistory: [20],
      actionTally: {}
    };

    /* { html, text } entries — html is what's rendered, text is what's exported/undone-to */
    const logEntries = [];

    /* Stack of { state, log } snapshots taken before each state-changing action */
    const undoStack = [];

    /* Difficulty presets. Life is deliberately NOT here anymore — it
       scales with the number of players instead (see
       startingLifeForPlayers),
       so a bigger table means a tougher Voraxus regardless of which
       difficulty is picked, and difficulty governs only its resources:
       starting mana, starting hand size, and whether it has to discard
       down to 7 at end of turn (levels 1-3 do, 4-5 don't). */
    const DIFFICULTY_PRESETS = {
      1: { totalMana: 0, cards: 7 },   // I'm Too Young to Die
      2: { totalMana: 0, cards: 7 },   // Hurt Me Plenty
      3: { totalMana: 3, cards: 7 },   // Ultra-Violence
      4: { totalMana: 5, cards: 9 },   // Nightmare
      5: { totalMana: 10, cards: 12 }  // Ultra-Nightmare
    };

    /** Voraxus's starting life, by table size: 40 per player for the
        first three (1 → 40, 2 → 80, 3 → 120), then only +20 for each
        additional player beyond that (4 → 140, 5 → 160, and so on).
        The curve flattens rather than stopping, so big tables still add
        life but at a slower rate than the early players do. */
    const LIFE_PER_EARLY_PLAYER = 40;
    const LIFE_FULL_RATE_UP_TO_PLAYERS = 3;
    const LIFE_PER_EXTRA_PLAYER = 20;

    function startingLifeForPlayers(players) {
      const n = Number.isInteger(players) && players > 0 ? players : 1;
      if (n <= LIFE_FULL_RATE_UP_TO_PLAYERS) {
        return n * LIFE_PER_EARLY_PLAYER;
      }
      return LIFE_FULL_RATE_UP_TO_PLAYERS * LIFE_PER_EARLY_PLAYER
        + (n - LIFE_FULL_RATE_UP_TO_PLAYERS) * LIFE_PER_EXTRA_PLAYER;
    }

    /* How much of a combat hit Voraxus actually takes scales with
       difficulty, using the SAME curve family throughout (a power curve,
       fraction = U^exponent) rather than switching shapes — just varying
       how strongly it's skewed, and which way, and only subtly at that
       (exponents stay close to 1, i.e. close to neutral, at every
       level — the most extreme bucket at the most extreme difficulty
       tops out around 12%, not far from the flat 10% baseline). Levels
       1-2 skew gently toward taking MOST of the hit (a slightly fragile
       Voraxus); level 3 is perfectly flat (plain Math.random(), no skew
       at all); levels 4-5 flip the exact same curve to skew gently
       toward shrugging most of it off (a slightly tanky Voraxus).
       "flip" means fraction = 1 - U^exponent instead of U^exponent — a
       true mirror reflection of the same bounded curve, not just the
       reciprocal exponent (which would change its shape, not just its
       direction). Levels 1 and 5 are exact mirrors of each other; so
       are 2 and 4. */
    const DAMAGE_CURVE_BY_DIFFICULTY = {
      1: { exponent: 0.8, flip: false }, // gently favors taking most of the hit
      2: { exponent: 0.9, flip: false }, // barely favors taking most of it
      3: { exponent: 1, flip: false },   // flat — every outcome equally likely
      4: { exponent: 0.9, flip: true },  // barely favors shrugging most of it off
      5: { exponent: 0.8, flip: true }   // gently favors shrugging most of it off
    };

    /* Permanent types Voraxus can target with destroy/sacrifice/bounce/
       exile. Battle removed entirely (not a possible result at all, not
       just weighted to zero); Creature comes up roughly 1/3 of the time,
       Land is the least common, and Artifact/Enchantment/Planeswalker
       stay even with each other. */
    const PERMANENT_TYPE_WEIGHTS = { Artifact: 4, Creature: 7, Enchantment: 4, Planeswalker: 3, Land: 2 };

    function pickPermanentType() {
      return weightedPick(PERMANENT_TYPE_WEIGHTS);
    }

    /** Picks n DISTINCT permanent types, weighted without replacement
        (each pick removes that type from the pool before the next roll),
        so Creature still comes up more than Land even across a multi-
        type wipe, just never repeats within one. */
    function pickMultiplePermanentTypes(n) {
      const pool = { ...PERMANENT_TYPE_WEIGHTS };
      const chosen = [];
      for (let i = 0; i < n && Object.keys(pool).length > 0; i++) {
        const pick = weightedPick(pool);
        chosen.push(pick);
        delete pool[pick];
      }
      return chosen;
    }

    /** Formats a list of permanent types as natural, pluralized English:
        "Lands"; "Lands and Artifacts"; "Lands, Artifacts, and Creatures". */
    function joinTypesForDisplay(types) {
      const plural = types.map(t => `${t}s`);
      if (plural.length === 1) return plural[0];
      if (plural.length === 2) return `${plural[0]} and ${plural[1]}`;
      return `${plural.slice(0, -1).join(", ")}, and ${plural[plural.length - 1]}`;
    }

    /** The shared removal-outcome roll used by Destroy, Sacrifice, Bounce,
        and Exile: mostly a single target (high or low mana value), and
        rarely a true board wipe across 1-4 permanent types at once, each
        additional type notably less likely than the last. The 1-type
        rate (5%) is exactly what "destroy/sacrifice/bounce/exile all of
        one type" already was; 2-4 types are new, added on top rather
        than carved out of that existing 5%, which is what lets the
        rarest tier (4 types at once) land in the same neighborhood as
        Voraxus summoning a large creature (both roughly 0.4% of
        everything Voraxus can do) while 1 type stays untouched. */
    function rollRemovalOutcome() {
      const roll = Math.random() * 100;
      // One named opponent (the most common case)
      if (roll < 29.9490) return { tier: "single", which: "highest" };
      if (roll < 71.1186) return { tier: "single", which: "lowest" };
      // Every opponent at once, but still only ONE permanent each — the
      // middle ground between spot removal and a full wipe. Carved out
      // of the single-target share so the wipe tiers below keep the
      // exact rates they were tuned to.
      if (roll < 76.1720) return { tier: "each", which: "highest" };
      if (roll < 83.1186) return { tier: "each", which: "lowest" };
      if (roll < 88.1186) return { tier: "wipe", count: 1, oneSided: rollOneSidedWipe() };
      if (roll < 92.5581) return { tier: "wipe", count: 2, oneSided: rollOneSidedWipe() };
      if (roll < 96.5000) return { tier: "wipe", count: 3, oneSided: rollOneSidedWipe() };
      return { tier: "wipe", count: 4, oneSided: rollOneSidedWipe() };
    }

    /* A wipe is as likely to spare Voraxus's own board as to catch it.
       One-sided sweeps cost this much more, since a symmetric wrath is
       partly self-punishing — it can cost Voraxus a developed board —
       while a one-sided one is pure upside. */
    const ONE_SIDED_WIPE_PREMIUM = 3;

    function rollOneSidedWipe() {
      return Math.random() < 0.5;
    }

    /** Wording for a wipe: a symmetric one hits everything, a one-sided
        one only what the opponents control. */
    function wipeScopeSuffix(oneSided) {
      return oneSided ? " controlled by its opponents" : "";
    }

    /** Who a non-wipe removal effect hits: one named opponent, or all of
        them at once for the "each" tier. */
    function removalScopeLabel(outcome) {
      return outcome.tier === "each"
        ? "each opponent"
        : `Player ${randomInt(gameState.numPlayers) + 1}`;
    }

    /** What share of Sacrifice casts become an "edict" — each opponent
        gives up 1-3 permanents, but chooses which ones themselves —
        rather than Voraxus naming an exact target or wiping whole
        types. */
    const SACRIFICE_EDICT_CHANCE = 30;

    /** Rolls one edict: how many permanents each opponent gives up, and
        what kind. Costs are scaled on two axes:

        COUNT — 3 mana for one, 5 for two, 7 for three. Each extra
        permanent is worth roughly two mana, matching how the existing
        multi-type wipes price their own escalation.

        FREEDOM — naming a specific type ("sacrifice a creature") is
        more constraining than "sacrifice a permanent", where the
        opponent can just feed it their worst land. The looser version
        is therefore priced 1 cheaper, since it does less per card.

        Counts lean heavily toward 1, so the three-permanent version
        stays a rare, memorable blowout rather than routine. */
    function rollSacrificeEdict() {
      const count = parseInt(weightedPick({ "1": 60, "2": 28, "3": 12 }), 10);
      const anyPermanent = Math.random() < 0.35;
      const baseCost = { 1: 3, 2: 5, 3: 7 }[count];
      const noun = anyPermanent ? "permanent" : pickPermanentType().toLowerCase();
      return {
        count: count,
        manaCost: baseCost - (anyPermanent ? 1 : 0),
        label: count > 1 ? `${noun}s` : noun

       the ones that appear in essentially every Magic release (rule 702
       lists them first, before the older set-specific mechanics). */
    const V_ABILITIES = [
      "Deathtouch", "Double Strike", "First Strike", "Flying", "Haste",
      "Hexproof", "Indestructible", "Lifelink", "Menace", "Reach",
      "Trample", "Vigilance", "Ward"

       so a low-difficulty commander draws only from the mild set — a
       "one mild static ability" tier shouldn't be able to roll an
       indestructible body. Rolled creatures still use the full list. */
    const MILD_ABILITIES = ["Flying", "Haste", "First Strike", "Trample", "Vigilance", "Menace", "Lifelink", "Reach"];

       the one keyword that genuinely locks the game up: the commander
       already returns to the command zone whenever it leaves the
       battlefield (rule 903.9), so making it untargetable on top of
       that leaves only non-targeting answers — board wipes and edicts.
       Indestructible deliberately ISN'T here: on a commander it grants
       almost nothing 903.9 isn't already granting, since the return-to-
       command-zone path never consults it. */
    const ELITE_ONLY_ABILITIES = ["Hexproof"];

        "strong" is everything except the elite-only keywords, and "all"
        is genuinely everything. */
    function commanderKeywordPool(poolName) {
      if (poolName === "mild") return MILD_ABILITIES;

     *  color nudges the odds toward the actions and creature stats that
     *  color is known for in Commander: White leans exile, Blue leans
     *  bounce/counter/draw, Black leans destroy/sacrifice/discard, Red
     *  leans direct damage and glass-cannon creatures, Green leans big
     *  creatures. Colorless keeps the original, perfectly even odds.
     *
     *  Multipliers are modest (roughly 0.5x–1.9x) on purpose: a color
     *  should feel like a leaning, not a guarantee. "Does nothing" (A) and
     *  the small/large creature split's baseline are left unaffected so a
     *  colorless Voraxus behaves exactly as before this feature existed.
     * ---------------------------------------------------------------- */
    const COLOR_AFFINITY = {
      //          destroy sac  bounce exile dmgCr dmgPl counter gyHate draw discard creatureFreq bigness power tougness
      White: { B: 0.8, C: 0.5, D: 0.8, E: 1.7, F: 0.9, G: 0.7, H: 0.7, I: 1.4, L: 0.8, M: 0.6, creature: 1.0, bigness: 0.8, powerBias: 0.9, toughnessBias: 1.3 },
      Blue:  { B: 0.5, C: 0.5, D: 1.8, E: 0.8, F: 0.5, G: 0.5, H: 1.9, I: 0.9, L: 1.7, M: 0.6, creature: 0.7, bigness: 0.7, powerBias: 0.7, toughnessBias: 0.9 },
      Black: { B: 1.6, C: 1.9, D: 0.6, E: 0.9, F: 0.9, G: 0.9, H: 0.6, I: 1.5, L: 1.2, M: 1.8, creature: 1.0, bigness: 1.1, powerBias: 1.1, toughnessBias: 1.0 },
      Red:   { B: 0.9, C: 0.6, D: 0.6, E: 0.6, F: 1.6, G: 1.9, H: 0.5, I: 0.6, L: 0.6, M: 0.9, creature: 1.1, bigness: 1.0, powerBias: 1.5, toughnessBias: 0.6 },
      Green: { B: 0.6, C: 0.5, D: 0.5, E: 0.6, F: 1.5, G: 0.6, H: 0.4, I: 0.5, L: 1.0, M: 0.5, creature: 1.6, bigness: 1.6, powerBias: 1.3, toughnessBias: 1.3 }
    };

    const NEUTRAL_AFFINITY = { B: 1, C: 1, D: 1, E: 1, F: 1, G: 1, H: 1, I: 1, L: 1, M: 1, creature: 1, bigness: 1, powerBias: 1, toughnessBias: 1 };

    /** Each color's two signature keywords get extra weight when a creature
        of that color rolls its ability. */
    /* Which keywords each color leans toward, following the colour pie:
       White gets the orderly defensive ones, Blue evasion and
       protection, Black attrition, Red aggression, Green size and
       reach. */
    const ABILITY_AFFINITY = {
      White: ["Flying", "First Strike", "Vigilance", "Lifelink"],
      Blue: ["Flying", "Hexproof", "Ward"],
      Black: ["Deathtouch", "Menace", "Indestructible"],
      Red: ["Haste", "Double Strike", "Menace"],
      Green: ["Trample", "Reach", "Vigilance", "Indestructible"]
    };

    /** Averages the color-pie multipliers across a set of colors (Voraxus's
        own colors for action odds, or one creature's own colors for its
        stats/ability). Colorless (or no colors) is perfectly neutral. */
    function getColorAffinity(colors) {
      if (!colors || colors.length === 0 || colors[0] === "Colorless") {
        return NEUTRAL_AFFINITY;
      }
      const combined = {};
      Object.keys(NEUTRAL_AFFINITY).forEach(key => {
        const total = colors.reduce((sum, c) => sum + (COLOR_AFFINITY[c] ? COLOR_AFFINITY[c][key] : 1), 0);
        combined[key] = total / colors.length;
      });
      return combined;
    }

    /** Rolls 1..max, skewed toward the high end when bias > 1 and toward
        the low end when bias < 1. bias === 1 is a plain uniform roll —
        identical to the game's original (colorless) behavior. */
    function biasedRoll(max, bias) {
      const b = bias || 1;
      const r = Math.pow(Math.random(), 1 / b);
      return Math.min(max, Math.floor(r * max) + 1);
    }

    /** Picks a random key from a {key: weight} map, proportional to weight. */
    function weightedPick(weights) {
      const entries = Object.entries(weights).filter(([, w]) => w > 0);
      const total = entries.reduce((sum, [, w]) => sum + w, 0);
      let roll = Math.random() * total;
      for (const [key, w] of entries) {
        if (roll < w) return key;
        roll -= w;
      }
      return entries[entries.length - 1][0];
    }

        each pick removes that ability from the pool before the next
        roll, same pattern as pickMultiplePermanentTypes for board
        wipes. A creature's own colors still bias which abilities it's
        likely to get (see ABILITY_AFFINITY), they just can't repeat
        within one creature now that more than one can be rolled. */

       opponent must pay to target the creature, so a higher value makes
       it correspondingly harder to answer. Ranges are capped to 1-4 and
       climb with difficulty. */
    const WARD_RANGE_BY_DIFFICULTY = {
      1: [1, 1],
      2: [1, 2],
      3: [2, 3],
      4: [2, 4],
      5: [3, 4]
    };

      const range = WARD_RANGE_BY_DIFFICULTY[gameState.difficultyMode] || WARD_RANGE_BY_DIFFICULTY[1];
      const [min, max] = range;
      return min + randomInt(max - min + 1);
    }

      const source = pool && pool.length ? pool : V_ABILITIES;
      const weights = {};
      source.forEach(a => { weights[a] = 1; });
      if (colors && colors.length > 0 && colors[0] !== "Colorless") {
        colors.forEach(c => {
          (ABILITY_AFFINITY[c] || []).forEach(a => {
            if (weights[a] != null) weights[a] += 1.5;
          });
        });
      }
      const chosen = [];
      for (let i = 0; i < count && Object.keys(weights).length > 0; i++) {
        const pick = weightedPick(weights);
        // Ward alone carries a number; everything else is a bare keyword.
        chosen.push(pick === "Ward" ? `Ward ${rollWardValue()}` : pick);
        delete weights[pick];
      }
      return chosen;
    }

        occasionally the rarer, more impressive 3 — replacing the old
        "all abilities" claim, which was never actually true (it only
        ever rolled one, just worded misleadingly). */
    function rollLargeCreatureAbilityCount() {
      return Math.random() < 0.6 ? 2 : 3;
    }

    function joinAbilitiesForDisplay(abilities) {

      if (abilities.length === 2) return `${abilities[0]} and ${abilities[1]}`;

        (empowers one of its own creatures) are intentionally left as
        fixed weights, unaffected by color.

        Counter ("H") isn't part of this pool at all anymore — it never
        made sense as one of many competing actions in the first place,
        since it could only ever actually happen when checking a
        response, not during Voraxus's own turn. It's now its own
        independent check, entirely separate from this weighted pool —
        see COUNTER_BASE_CHANCE_BY_DIFFICULTY and handleCheckResponse()
        below. Its old weight (4366.667 with creatures, 4666.667
        without) was removed and split EVENLY — not proportionally,
        unlike every other rebalance here — across the 13 remaining
        slots, +335.8975 apiece (with creatures) or +358.9744 apiece
        (without). The two BASE_WEIGHTS tables below already have that
        even split baked in, at difficulty level 1.

        so hasCreatures selects between two complete weight sets rather
        than just zeroing O out in place: when false, every other weight
        (including N, independently reduced the same way) reflects O
        never existing at all, instead of leaving a dead weight that
        would otherwise just inflate "A" by default. */
    const BASE_WEIGHTS = {
      withCreatures: {
        A: 37500, B: 4141.4548, C: 3196.9127, D: 4141.4548, E: 3196.9127,
        F: 4141.4548, G: 4141.4548, I: 1780.0992, JK: 16892.7769,
        L: 2252.3706, M: 2252.3706, N: 5581.8915, O: 6274.4421, P: 2253.2023, Q: 2253.2023
      },
      withoutCreatures: {
        A: 37500, B: 4576.5695, C: 3532.7908, D: 4576.5695, E: 3532.7908,
        F: 4576.5695, G: 4576.5695, I: 1967.1221, JK: 18667.5871,
        L: 2489.0121, M: 2489.0121, N: 6517.0138, O: 338.6654, P: 2329.864, Q: 2329.864
      }
    };

    /** How much "A" (does nothing) shrinks as difficulty rises — a
        busier, more active Voraxus at higher difficulty. Level 1 is the
        anchor at 37.5%, and each level above multiplies by ~0.8801 on
        top of the level below it (compounding, not flat off level 1).
        That ratio is the exact fourth root of 22.5/37.5, chosen so the
        four steps land precisely on 22.5% at level 5 rather than
        approximately — a top-difficulty Voraxus passes its turn barely
        half as often as an easy one. Whatever gets removed from A is
        added back PROPORTIONALLY across every other action (including
        N, O, P and Q, which are otherwise fixed against color
        specifically, but aren't exempt from this), preserving their
        ratios to each other — the same redistribution principle used
        everywhere else in this file except the one deliberately-even
        Counter rebalance above. */
    const A_DIFFICULTY_STEP = Math.pow(22.5 / 37.5, 1 / 4);
    const A_SCALE_BY_DIFFICULTY = {
      1: 1,
      2: A_DIFFICULTY_STEP,
      3: Math.pow(A_DIFFICULTY_STEP, 2),
      4: Math.pow(A_DIFFICULTY_STEP, 3),
      5: Math.pow(A_DIFFICULTY_STEP, 4)
    };

    /* On top of difficulty, a busier table makes Voraxus act more: more
       opponents means more threats it should be answering, so passing
       the turn gets steadily less appealing. Each extra player trims
       "does nothing" by another 5% of its current value, and the effect
       stops counting past four players — beyond that the table is
       already crowded enough that further seats shouldn't keep pushing
       it down indefinitely. */
    const A_PLAYER_STEP = 0.95;
    const A_PLAYER_CAP = 4;

    function aScaleForPlayers(numPlayers) {
      const n = Number.isInteger(numPlayers) && numPlayers > 0 ? numPlayers : 1;
      const extraSeats = Math.min(n, A_PLAYER_CAP) - 1;
      return Math.pow(A_PLAYER_STEP, extraSeats);
    }

    function computeActionWeights(affinity, hasCreatures, difficulty, numPlayers) {
      const base = hasCreatures ? BASE_WEIGHTS.withCreatures : BASE_WEIGHTS.withoutCreatures;
      const difficultyScale = A_SCALE_BY_DIFFICULTY[difficulty] != null ? A_SCALE_BY_DIFFICULTY[difficulty] : 1;
      // The two factors multiply: a harder Voraxus at a fuller table
      // passes its turn least often of all.
      const scale = difficultyScale * aScaleForPlayers(numPlayers);
      const newA = base.A * scale;
      const freed = base.A - newA;

      const otherKeys = ["B", "C", "D", "E", "F", "G", "I", "JK", "L", "M", "N", "O", "P", "Q"];
      const othersSum = otherKeys.reduce((sum, k) => sum + base[k], 0);
      const redistributeFactor = othersSum > 0 ? (othersSum + freed) / othersSum : 1;

      return {
        A: newA,
        B: base.B * redistributeFactor * affinity.B,
        C: base.C * redistributeFactor * affinity.C,
        D: base.D * redistributeFactor * affinity.D,
        E: base.E * redistributeFactor * affinity.E,
        F: base.F * redistributeFactor * affinity.F,
        G: base.G * redistributeFactor * affinity.G,
        I: base.I * redistributeFactor * affinity.I,
        JK: base.JK * redistributeFactor * affinity.creature,
        L: base.L * redistributeFactor * affinity.L,
        M: base.M * redistributeFactor * affinity.M,
        N: base.N * redistributeFactor,
        O: base.O * redistributeFactor,
        // P (cast an artifact) and Q (cast an enchantment) are new and
        // deliberately left color-flat for now, same as N/O — assigning
        // real per-color affinities makes more sense once there's an
        // actual card list to reason about (some artifacts/enchantments
        // will clearly want to skew toward particular colors, some
        // won't), rather than guessing ahead of that list.
        P: base.P * redistributeFactor,
        Q: base.Q * redistributeFactor
      };
    }

    /** Splits the combined creature-summon weight into "small" (J) and
        "large" (K) shares. At the neutral bigness of 1 this reproduces the
        original ~97:3 J:K split almost exactly. */
    function splitCreatureWeight(jkWeight, bigness) {
      const kShare = Math.min(0.4, 0.028 * bigness * bigness);
      return { J: jkWeight * (1 - kShare), K: jkWeight * kShare };
    }

    /* DOM elements (assigned on page load) */
    let configBox, statusBar, commandZoneBar, logBox, actionsBox;
    let creaturesBox, artifactsBox;
    let numberDialog, numberDialogMessage, numberDialogInput;
    let numberDialogMinus, numberDialogPlus, numberDialogCancel, numberDialogOk;
    let confirmDialog, confirmDialogMessage, confirmCancelBtn, confirmOkBtn;
    let removalDialog, removalDialogMessage, removalBounceBtn, removalDestroyBtn, removalStunBtn, removalCancelBtn;
    let giveCreatureDialog, giveCreaturePower, giveCreatureToughness, giveCreatureAbility, giveCreatureType;
    let giveCreatureCancelBtn, giveCreatureOkBtn;

    /* References to dynamic action buttons whose disabled state depends on
       game state, so they can be kept in sync from updateStatus(). */
    let btnForceDiscardRef = null;
    let btnRemoveManaRef = null;
    let btnRemoveManaSourceRef = null;
    let btnUndoRef = null;

    /* Creature ids, so each tap-to-remove targets the right one */
    let nextCreatureId = 1;
    let nextPermanentId = 1;

    function recalculateNextCreatureId() {
      nextCreatureId = gameState.creatures.reduce((max, c) => Math.max(max, c.id || 0), 0) + 1;
    }

    function recalculateNextPermanentId() {
      nextPermanentId = gameState.artifactsAndEnchantments.reduce((max, p) => Math.max(max, p.id || 0), 0) + 1;
    }

    /* ------------------------------------------------------------------
     *  Persistence (localStorage autosave / resume)
     * ---------------------------------------------------------------- */
    function saveGameState() {
      try {
        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify({ version: SAVE_VERSION, state: gameState, log: logEntries })
        );
      } catch (err) {
        console.warn("Could not save game state:", err);
      }
    }

    function loadGameState() {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || parsed.version !== SAVE_VERSION || !parsed.state) return null;
        return parsed;
      } catch (err) {
        console.warn("Could not load saved game state:", err);
        return null;
      }
    }

    function clearSavedGame() {
      try {
        localStorage.removeItem(SAVE_KEY);
      } catch (err) {
        console.warn("Could not clear saved game state:", err);
      }
    }

    /* ------------------------------------------------------------------
     *  Undo history
     * ---------------------------------------------------------------- */
    function deepClone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function pushUndoSnapshot() {
      undoStack.push({ state: deepClone(gameState), log: deepClone(logEntries) });
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      refreshUndoButtonState();
    }

    function refreshUndoButtonState() {
      if (btnUndoRef) btnUndoRef.disabled = undoStack.length === 0;
    }

    function handleUndo() {
      if (undoStack.length === 0) return;
      const snapshot = undoStack.pop();

      Object.assign(gameState, snapshot.state);
      recalculateNextCreatureId();
      recalculateNextPermanentId();
      logEntries.length = 0;
      logEntries.push(...snapshot.log);
      renderLogFromEntries();
      logMessage("<i>(Last action undone.)</i>");

      renderMainMenuButtons();
      refreshUndoButtonState();
    }

    /* ------------------------------------------------------------------
     *  Modal dialog helper (replaces window.prompt for numeric input)
     * ---------------------------------------------------------------- */
    function showNumberPrompt(message, { min = null, defaultValue = "" } = {}) {
      return new Promise(resolve => {
        numberDialogMessage.textContent = message;
        numberDialogInput.value = defaultValue;
        if (min !== null) {
          numberDialogInput.min = String(min);
        } else {
          numberDialogInput.removeAttribute("min");
        }

        function onClose() {
          numberDialog.removeEventListener("close", onClose);
          if (numberDialog.returnValue !== "ok") {
            resolve(null);
            return;
          }
          const raw = numberDialogInput.value;
          resolve(raw === "" ? null : parseInt(raw, 10));
        }

        numberDialog.addEventListener("close", onClose);
        numberDialogCancel.onclick = () => numberDialog.close("cancel");
        numberDialogOk.onclick = () => numberDialog.close("ok");

        numberDialog.showModal();
        numberDialogInput.focus();
        numberDialogInput.select();
      });
    }

    /** Nudges the number dialog's value by `delta`, respecting its min. */
    function stepNumberDialog(delta) {
      const current = parseInt(numberDialogInput.value, 10) || 0;
      const min = numberDialogInput.min === "" ? -Infinity : parseInt(numberDialogInput.min, 10);
      numberDialogInput.value = Math.max(min, current + delta);
    }

    /* ------------------------------------------------------------------
     *  Modal dialog helper (replaces window.confirm / window.alert)
     * ---------------------------------------------------------------- */
    function showConfirmDialog(message, { okOnly = false, confirmLabel = "Confirm", cancelLabel = "Cancel" } = {}) {
      return new Promise(resolve => {
        confirmDialogMessage.textContent = message;
        confirmCancelBtn.style.display = okOnly ? "none" : "";
        confirmCancelBtn.textContent = cancelLabel;
        confirmOkBtn.textContent = confirmLabel;

        function onClose() {
          confirmDialog.removeEventListener("close", onClose);
          resolve(confirmDialog.returnValue === "ok");
        }

        confirmDialog.addEventListener("close", onClose);
        confirmCancelBtn.onclick = () => confirmDialog.close("cancel");
        confirmOkBtn.onclick = () => confirmDialog.close("ok");

        confirmDialog.showModal();
      });
    }

    /** Three-way version of showConfirmDialog, for deciding what an
        opponent's removal actually did to one of Voraxus's permanents.
        Resolves to "bounce", "destroy", or "cancel". */
    function showRemovalDialog(message) {
      return new Promise(resolve => {
        removalDialogMessage.textContent = message;

        function onClose() {
          removalDialog.removeEventListener("close", onClose);
          const value = removalDialog.returnValue;
          const valid = ["bounce", "destroy", "stun"];
          resolve(valid.includes(value) ? value : "cancel");
        }

        removalDialog.addEventListener("close", onClose);
        removalBounceBtn.onclick = () => removalDialog.close("bounce");
        removalDestroyBtn.onclick = () => removalDialog.close("destroy");
        removalStunBtn.onclick = () => removalDialog.close("stun");
        removalCancelBtn.onclick = () => removalDialog.close("cancel");

        removalDialog.showModal();
      });
    }

    /** For when an opponent's spell or ability gives Voraxus a creature
        directly (a Swan Song bird token, say) — resolves to
        { power, toughness, ability, type } on confirm, or null on
        cancel. ability is "" when "None" was left selected. */
    function showGiveCreatureDialog() {
      return new Promise(resolve => {
        giveCreaturePower.value = "1";
        giveCreatureToughness.value = "1";
        giveCreatureAbility.value = "";
        giveCreatureType.value = "";

        function onClose() {
          giveCreatureDialog.removeEventListener("close", onClose);
          if (giveCreatureDialog.returnValue !== "ok") {
            resolve(null);
            return;
          }
          resolve({
            power: parseInt(giveCreaturePower.value, 10) || 0,
            toughness: parseInt(giveCreatureToughness.value, 10) || 0,
            ability: giveCreatureAbility.value,
            type: giveCreatureType.value.trim()
          });
        }

        giveCreatureDialog.addEventListener("close", onClose);
        giveCreatureCancelBtn.onclick = () => giveCreatureDialog.close("cancel");
        giveCreatureOkBtn.onclick = () => giveCreatureDialog.close("ok");

        giveCreatureDialog.showModal();
        giveCreaturePower.focus();
        giveCreaturePower.select();
      });
    }

    /* ------------------------------------------------------------------
     *  Battle Stats: live life sparkline + action tally
     * ---------------------------------------------------------------- */
    const ACTION_NAMES = {
      A: "Does nothing", B: "Destroy", C: "Sacrifice", D: "Bounce", E: "Exile",
      F: "Damage (creature/PW)", G: "Damage (player)", H: "Counter",
      I: "Exile graveyards", J: "Summon (small)", K: "Summon (large)",
      L: "Draw cards", M: "Force discard", N: "Heal", O: "Empower creature",
      P: "Cast artifact", Q: "Cast enchantment", CMD: "Cast commander"
    };

    /** Builds a small inline SVG line chart from the life-total history —
        deliberately plain (no axes, no gridlines): the point is a
        glanceable trend, not a precise reading, so it stays readable at
        the size a dialog on a phone actually has room for. */
    function buildLifeSparklineSVG(history) {
      const w = 300, h = 60, pad = 4;
      if (!Array.isArray(history) || history.length < 2) {
        return '<svg viewBox="0 0 300 60" width="100%" height="60" role="img" aria-label="Not enough life history yet to chart."></svg>';
      }
      const max = Math.max(...history, 1);
      const min = Math.min(...history, 0);
      const range = Math.max(max - min, 1);
      const stepX = (w - pad * 2) / (history.length - 1);
      const points = history.map((v, i) => {
        const x = pad + i * stepX;
        const y = h - pad - ((v - min) / range) * (h - pad * 2);
        return `${x.toFixed(1)},${y.toFixed(1)}`;
      }).join(" ");
      const last = history[history.length - 1];
      return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="60" preserveAspectRatio="none" role="img" aria-label="Life total over the game, from ${history[0]} to ${last}.">` +
        `<polyline points="${points}" fill="none" stroke="var(--accent-gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>` +
        `</svg>`;
    }

    /** Renders the action tally as a compact list, busiest action first,
        skipping anything that hasn't fired yet so an early game doesn't
        show fourteen rows of zeroes. */
    function buildActionTallyHTML(tally) {
      const entries = Object.entries(tally || {})
        .filter(([, count]) => count > 0)
        .sort((a, b) => b[1] - a[1]);
      if (entries.length === 0) {
        return "<p>No actions taken yet this game.</p>";
      }
      return `<ul class="tally-list">` +
        entries.map(([key, count]) => `<li><span>${ACTION_NAMES[key] || key}</span><span>${count}</span></li>`).join("") +
        `</ul>`;
    }

    function showStatsDialog() {
      document.getElementById("statsCurrentLife").textContent =
        `Currently at ${Math.max(0, gameState.voraxusLife)} life`;
      document.getElementById("statsSparkline").innerHTML = buildLifeSparklineSVG(gameState.lifeHistory);
      document.getElementById("statsTallyList").innerHTML = buildActionTallyHTML(gameState.actionTally);
      document.getElementById("statsDialog").showModal();
    }

    function setUpStatsDialog() {
      document.getElementById("statsBtn").onclick = showStatsDialog;
      document.getElementById("statsCloseBtn").onclick = () => document.getElementById("statsDialog").close();
    }

    /** For any "unless its controller pays" style trigger, where the
        opponent's card asks Voraxus to choose whether to pay an optional
        cost. Voraxus has no way to evaluate what it's paying for, so
        this is a straight coin flip — with one deterministic exception:
        with no untapped mana it simply can't pay, so the roll is
        skipped rather than producing an impossible answer.

        Nothing is deducted automatically, since the cost varies with
        whatever triggered it — use "Remove Mana" for the actual amount
        once the decision is made. */
    function setUpPayDecisionButton() {
      document.getElementById("payDecisionBtn").onclick = () => {
        if (gameState.voraxusCurrentMana <= 0) {
          logMessage(`<b>${gameState.botName} has no mana available and cannot pay.</b>`);
          return;
        }
        const pays = Math.random() < 0.5;
        logMessage(pays
          ? `<b>${gameState.botName} pays.</b> (${gameState.voraxusCurrentMana} mana available — deduct the cost with "Remove Mana".)`
          : `<b>${gameState.botName} does not pay.</b>`);
      };
    }

    /* ------------------------------------------------------------------
     *  Random helpers
     * ---------------------------------------------------------------- */
    function randomInt(max) {
      return Math.floor(Math.random() * max);
    }

    function pickRandom(array) {
      return array[randomInt(array.length)];
    }

    function shuffle(array) {
      return [...array].sort(() => 0.5 - Math.random());
    }

    /** Randomize Voraxus' colors (1-in-6 chance of colorless). */
    function randomizeVoraxusColors() {
      const colorPool = ["White", "Blue", "Black", "Red", "Green"];
      if (randomInt(6) === 0) {
        return ["Colorless"];
      }
      const numColors = randomInt(5) + 1;
      return shuffle(colorPool).slice(0, numColors);
    }

    /* ------------------------------------------------------------------
     *  Commander (Commander-variant rules 903.8 / 903.9 / 903.10)
     * ---------------------------------------------------------------- */
    /* One unique legendary per possible color identity. Voraxus can roll
       Colorless or any 1-5 colour combination, which is 31 subsets plus
       Colorless = 32 identities, so every one gets its own name. Keys are
       colour initials in canonical WUBRG order. */
    const COMMANDER_NAMES = {
      "C": "The Nullform Engine",
      "W": "Seraphine, Dawnward Exalted",
      "U": "Thessaly, Tide-Scribe",
      "B": "Morvath, the Hollow Crown",
      "R": "Ignarok, Emberfury",
      "G": "Vaelmora, Rootsovereign",
      "WU": "Aurelis, Skyward Oracle",
      "WB": "Halvane, the Pale Verdict",
      "WR": "Kaldris, Ember-Saint",
      "WG": "Sylvaine, Warden of Bloom",
      "UB": "Nerathis, Whisper of Depths",
      "UR": "Volkaris, Stormcalculus",
      "UG": "Mirelle, the Tidebound Bloom",
      "BR": "Skarnyx, the Ashen Maw",
      "BG": "Ossuvane, Rot-Matron",
      "RG": "Brakkul, the Wildfire Horn",
      "WUB": "Ysolde, the Thrice-Sworn",
      "WUR": "Caelithar, Prism Herald",
      "WUG": "Elowen, Dawnstream Keeper",
      "WBR": "Marrowgast, the Iron Sermon",
      "WBG": "Thanuvel, the Quiet Harvest",
      "WRG": "Torvald, Sunhide Rampart",
      "UBR": "Xevrath, the Drowned Crown",
      "UBG": "Nyxalla, Silt-Weaver",
      "URG": "Zarnis, the Cyclone Root",
      "BRG": "Grulmoth, the Cinder Warren",
      "WUBR": "Velantha, the Fourfold Edict",
      "WUBG": "Oranthe, Tideglass Sovereign",
      "WURG": "Kaemyr, the Storm Covenant",
      "WBRG": "Dravenna, the Scarlet Accord",
      "UBRG": "Thal'gorath, the Sunless Pact",
      "WUBRG": "Voraxus Ascendant, the All-Hued"
    };

    /* Commander stats by difficulty, on three separate axes:

         power/toughness - raw body size
         abilityCount    - KEYWORD abilities (Flying, Trample, ...).
                           Zero at difficulty 1, so the easiest
                           commander is a plain vanilla body.
         passive         - a standing triggered ability, using the exact
                           same trigger vocabulary as the artifacts and
                           enchantments (see firePermanentTrigger), and
                           only active while the commander is actually
                           on the battlefield.

       The passives escalate from "barely noticeable" to "must be
       answered". All of it lives in this one table so the numbers can
       be retuned without touching any logic. */
    const COMMANDER_BY_DIFFICULTY = {
      1: {
        power: 3, toughness: 3, baseCost: 4, abilityCount: 0, keywordPool: "mild",
        passive: {
          trigger: "creatureCast",
          text: "Whenever Voraxus casts a creature, it gains 1 life.",
          run: () => { gameState.voraxusLife += 1; pushLifeHistory(); return "gains 1 life"; }
        }
      },
      2: {
        power: 4, toughness: 4, baseCost: 5, abilityCount: 1, keywordPool: "mild",
        passive: {
          trigger: "creatureCast",
          text: "Each creature Voraxus casts enters with +1/+0.",
          creatureMod: { power: 1, toughness: 0 }
        }
      },
      3: {
        power: 5, toughness: 5, baseCost: 6, abilityCount: 2, keywordPool: "mild",
        passive: {
          trigger: "turnStart",
          text: "At the start of each of Voraxus's turns, each opponent loses 2 life.",
          run: () => "each opponent loses 2 life"
        }
      },
      4: {
        power: 6, toughness: 6, baseCost: 7, abilityCount: 2, keywordPool: "strong",
        passive: {
          trigger: "creatureCast",
          text: "Each creature Voraxus casts enters with +1/+1, and Voraxus gains 2 life.",
          creatureMod: { power: 1, toughness: 1 },
          run: () => { gameState.voraxusLife += 2; pushLifeHistory(); return "gains 2 life"; }
        }
      },
      5: {
        power: 7, toughness: 7, baseCost: 8, abilityCount: 3, keywordPool: "all",
        passive: {
          trigger: "turnStart",
          text: "At the start of each of Voraxus's turns, Voraxus draws a card and each opponent loses 3 life.",
          run: () => { drawVoraxusCards(1); return "draws a card, and each opponent loses 3 life"; }
        }
      }
    };

    const WUBRG_ORDER = ["White", "Blue", "Black", "Red", "Green"];
    const COLOR_INITIALS = { White: "W", Blue: "U", Black: "B", Red: "R", Green: "G", Colorless: "C" };

    /** Colour identity key in canonical WUBRG order, e.g. ["Red","White"]
        becomes "WR" so the lookup doesn't depend on roll order. */
    function commanderColorKey(colors) {
      if (!colors || colors.length === 0 || colors[0] === "Colorless") return "C";
      return WUBRG_ORDER.filter(c => colors.includes(c)).map(c => COLOR_INITIALS[c]).join("");
    }

    /** Builds the commander for this game. Rule 903.3 makes the
        commander share the deck's colour identity, so it simply takes
        Voraxus's own colours. */
    function buildCommander() {
      const tier = COMMANDER_BY_DIFFICULTY[gameState.difficultyMode] || COMMANDER_BY_DIFFICULTY[1];
      const colors = gameState.voraxusColors.slice();
      return {
        name: COMMANDER_NAMES[commanderColorKey(colors)] || "The Nameless Sovereign",
        power: tier.power,
        toughness: tier.toughness,
        baseCost: tier.baseCost,
        abilities: pickMultipleAbilities(colors, tier.abilityCount, commanderKeywordPool(tier.keywordPool)),
        colors: colors,
        castCount: 0,
        zone: "command",
        // The tier index is stored rather than the passive object
        // itself, so the passive's functions survive a save/reload
        // round trip (JSON can't serialise them) — it's looked back up
        // from the table by commanderPassive().
        tier: gameState.difficultyMode
      };
    }

    /** The commander's passive, but only while it's actually on the
        battlefield — a permanent in the command zone does nothing, same
        as any other card that isn't in play. */
    function commanderPassive() {
      const c = gameState.commander;
      if (!c || c.zone !== "battlefield") return null;
      const tier = COMMANDER_BY_DIFFICULTY[c.tier] || COMMANDER_BY_DIFFICULTY[1];
      return tier.passive || null;
    }

    /** Rule 903.8 — an additional {2} for each previous cast from the
        command zone ("commander tax"). */
    function commanderCastCost() {
      const c = gameState.commander;
      return c ? c.baseCost + (c.castCount * 2) : 0;
    }

    /** Rule 903.9 — a commander that would leave for the graveyard,
        exile, hand or library goes back to the command zone instead, so
        it is never permanently answered; it just gets more expensive. */
    function returnCommanderToCommandZone(reason) {
      const c = gameState.commander;
      if (!c || c.zone !== "battlefield") return;
      c.zone = "command";
      gameState.creatures = gameState.creatures.filter(cr => !cr.isCommander);
      gameState.voraxusCreatureCount = gameState.creatures.length;
      logMessage(`${c.name} returns to the command zone${reason ? ` (${reason})` : ""}. Next cast costs ${commanderCastCost()}.`);
    }

    /** Puts the commander onto the battlefield as a normal creature (so
        combat, attack assignment and the creature list all work on it
        unchanged), flagged so removal sends it home instead of killing
        it. Assumes the cost has already been paid. */
    function putCommanderOntoBattlefield() {
      const c = gameState.commander;
      const hasteFlag = c.abilities.includes("Haste");
      gameState.creatures.push({
        id: nextCreatureId++,
        power: c.power,
        toughness: c.toughness,
        summonedThisTurn: true,
        hasHaste: hasteFlag,
        attackTarget: null,
        tapped: false,
        stunCounters: 0,
        description: `${c.power}/${c.toughness} ${c.name}`,
        abilities: c.abilities.slice(),
        colors: c.colors.slice(),
        manaCost: commanderCastCost(),
        sizeTier: "large",
        isCommander: true,
        iconId: pickRandom(CREATURE_ICON_IDS)
      });
      gameState.voraxusCreatureCount = gameState.creatures.length;
      flashCreature(gameState.creatures[gameState.creatures.length - 1].iconId, c.colors);
      c.zone = "battlefield";
      c.castCount++;
    }

    /** Whether Voraxus casts its commander right now. "Optimal" here
        means: it's in the command zone, Voraxus can actually pay the
        taxed cost, and the board is thin enough that a big body is
        worth more than another random spell. */
    function shouldCastCommander() {
      const c = gameState.commander;
      if (!c || c.zone !== "battlefield" && c.zone !== "command") return false;
      if (c.zone !== "command") return false;
      if (commanderCastCost() > gameState.voraxusCurrentMana) return false;
      return gameState.creatures.length < 3;
    }

    /** Randomize a creature's colors as a subset of Voraxus' colors. */
    function randomizeCreatureColors() {
      const voraxusColors = gameState.voraxusColors;
      if (voraxusColors.length === 1 && voraxusColors[0] === "Colorless") {
        return ["Colorless"];
      }
      if (randomInt(6) === 0) {
        return ["Colorless"];
      }
      const howMany = randomInt(voraxusColors.length) + 1;
      return shuffle(voraxusColors).slice(0, howMany);
    }

    /* ------------------------------------------------------------------
     *  HTML fragment builders
     * ---------------------------------------------------------------- */
    function getColorStripesHTML() {
      const stripes = gameState.voraxusColors
        .map(col => `<div class="color-stripe" style="background-color:${COLOR_MAP[col] || "#999999"};"></div>`)
        .join("");
      return `<div class="color-stripes-container">${stripes}</div>`;
    }

    function getCreatureColorSquaresHTML(colorsArray) {
      return colorsArray
        .map(col => `<span class="creature-color-square" style="background-color:${COLOR_MAP[col] || "#999999"};"></span>`)
        .join("");
    }

    /* ------------------------------------------------------------------
     *  Logging helpers
     * ---------------------------------------------------------------- */
    function logMessage(message) {
      const p = document.createElement("p");
      p.innerHTML = message;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
      logEntries.push({ html: message, text: message.replace(/<\/?[^>]+(>|$)/g, "") });

      // Cap the log. Without this it grows forever, and because every
      // undo snapshot deep-clones the whole log, the per-action cost
      // and the saved-game size both climb quadratically over a long
      // game. Trimming the oldest entries keeps both flat. The visible
      // log box is trimmed to match so the two never drift apart.
      if (logEntries.length > MAX_LOG_ENTRIES) {
        const excess = logEntries.length - MAX_LOG_ENTRIES;
        logEntries.splice(0, excess);
        for (let i = 0; i < excess && logBox.firstChild; i++) {
          logBox.removeChild(logBox.firstChild);
        }
      }
    }

    function logVoraxusAction(actionText) {
      logMessage("• " + actionText);
    }

    /** Rebuilds the visible log box from logEntries (used after undo/resume). */
    function renderLogFromEntries() {
      logBox.innerHTML = "";
      logEntries.forEach(entry => {
        const p = document.createElement("p");
        p.innerHTML = entry.html;
        logBox.appendChild(p);
      });
      logBox.scrollTop = logBox.scrollHeight;
    }

    function handleExportLog() {
      if (logEntries.length === 0) {
        logMessage("No log entries to export yet.");
        return;
      }
      const header = `Voraxus Game Log — exported ${new Date().toLocaleString()}\n${"=".repeat(40)}\n`;
      const content = header + logEntries.map(e => e.text).join("\n");

      try {
        const blob = new Blob([content], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `voraxus-game-log-${Date.now()}.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      } catch (err) {
        console.warn("Could not export log:", err);
        alert("Sorry, exporting the log failed.");
      }
    }

    /* ------------------------------------------------------------------
     *  Mana & creature helpers
     * ---------------------------------------------------------------- */
