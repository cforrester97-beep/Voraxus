    function checkAndDeductMana(cost) {
      if (gameState.voraxusCurrentMana < cost) {
        // Deliberately gives nothing away: naming the shortfall would
        // tell the opponents both that Voraxus tried something and
        // exactly how expensive it was — information a real opponent
        // would never volunteer. The Stats tally agrees with the log
        // and records this as a pass, since from the table's point of
        // view nothing happened.
        gameState.actionTally.A = (gameState.actionTally.A || 0) + 1;
        logVoraxusAction(`${gameState.botName} does nothing.`);
        return false;
      }
      gameState.voraxusCurrentMana -= cost;
      return true;
    }

    function spendCard() {
      gameState.voraxusCards = Math.max(0, gameState.voraxusCards - 1);
    }

    function finalizeNewCreatures() {
      gameState.creatures.forEach(creature => {
        creature.summonedThisTurn = false;
        // Attack assignments are scoped to the turn's combat — clear them
        // here so a stale "attacking Player 2" doesn't linger into a turn
        // where combat hasn't happened yet.
        creature.attackTarget = null;
      });
    }

    /** True if this creature is currently eligible to attack — either it
        wasn't summoned this turn (no summoning sickness) or it has Haste. */
    /** A creature can attack if it isn't summoning sick (or has Haste)
        and isn't already tapped. */
    function creatureCanAttack(creature) {
      if (creature.tapped) return false;
      return !creature.summonedThisTurn || creature.hasHaste;
    }

    /** Untaps everything at the start of Voraxus's turn, the same as a
        real untap step — except that a creature with stun counters
        removes one instead of untapping (rule 122.1d), so each counter
        costs it one more turn tapped down. */
    function untapAllCreatures() {
      let untapped = 0;
      let stunsBurned = 0;
      gameState.creatures.forEach(creature => {
        if (!creature.tapped) return;
        if (creature.stunCounters > 0) {
          creature.stunCounters--;
          stunsBurned++;
          return;
        }
        creature.tapped = false;
        untapped++;
      });
      if (untapped > 0) {
        logMessage(`${gameState.botName} untaps ${untapped} creature${untapped === 1 ? "" : "s"}.`);
      }
      if (stunsBurned > 0) {
        logMessage(`${stunsBurned} creature${stunsBurned === 1 ? " stays" : "s stay"} tapped, removing a stun counter instead.`);
      }
    }

    /** Voraxus has no way to see the opponents' board states, so every
        eligible attacker is assumed to swing every combat — this just
        decides, at random, which of the actual players in the game each
        one is coming at. Re-rolled fresh each time Voraxus goes to
        combat, and naturally limited to real seats: a 1-player game
        always assigns Player 1, a 2-player game only ever assigns
        Player 1 or 2, and so on. */
    /** Declares attackers. Tapping happens in the same pass rather than
        as a follow-up step, because that's what rule 508.1f describes:
        tapping isn't a cost paid to attack, it's simply part of being
        declared an attacker. Keeping the two together also means no
        code inserted later can open a window where a creature is
        attacking but somehow still untapped.

        Vigilance is the exception the keyword exists for — those
        creatures attack and stay untapped, so they can still block. */
    function assignAttackTargets() {
      gameState.creatures.forEach(creature => {
        if (!creatureCanAttack(creature)) {
          creature.attackTarget = null;
          return;
        }
        creature.attackTarget = randomInt(gameState.numPlayers) + 1;
        if (!(creature.abilities || []).includes("Vigilance")) {
          creature.tapped = true;
        }
      });
    }

    /** Logs a plain-language summary of this combat's attack assignments,
        so it's captured in the game log (and the exportable log file). */
    function logAttackAssignments() {
      const attackers = gameState.creatures.filter(c => c.attackTarget != null);
      const sickCount = gameState.creatures.filter(c => c.attackTarget == null && c.summonedThisTurn && !c.hasHaste).length;

      if (attackers.length > 0) {
        const lines = attackers.map(c => `${c.description} \u2192 Player ${c.attackTarget}`);
        logMessage(lines.join("<br>"));
      } else {
        logVoraxusAction(`${gameState.botName} has no eligible attackers this combat.`);
      }
      if (sickCount > 0) {
        logVoraxusAction(`${sickCount} creature(s) have summoning sickness and don't attack this turn.`);
      }
    }

    /** Rolls a creature of the given size tier ("small" or "large"): its
        color first, then lets THAT color (not necessarily Voraxus's full
        color set, since a multicolor Voraxus can still make a mono-colored
        creature) bias its power/toughness/ability — the same way a red
        creature in a Golgari Voraxus deck would still play like a red
        creature. Does not touch game state; call addCreatureToBattlefield()
        with the result once mana affordability is confirmed. */
    function rollCreature(sizeTier) {
      const colors = randomizeCreatureColors();
      const affinity = getColorAffinity(colors);
      const maxStat = sizeTier === "large" ? 12 : 6;
      const power = biasedRoll(maxStat, affinity.powerBias);
      const toughness = biasedRoll(maxStat, affinity.toughnessBias);
      const abilityCount = sizeTier === "large" ? rollLargeCreatureAbilityCount() : 1;
      const abilities = pickMultipleAbilities(colors, abilityCount);
      // No ability text baked into the description anymore — abilities
      // are shown as their own persistent badges on the creature card
      // instead (see getAbilityBadgesHTML), so there's exactly one
      // place they're displayed rather than two that could disagree.
      const description = `${power}/${toughness} creature`;
      return { power, toughness, abilities, colors, description, sizeTier };
    }

    /** Commits a creature rolled by rollCreature() onto the battlefield.
        manaCost and sizeTier are stored on the creature itself so that
        if an opponent later bounces it back to hand, Voraxus can recast
        that exact same card for that exact same cost.

        Any standing "enters with" bonuses from Voraxus's artifacts and
        enchantments are applied HERE, as the creature is created, so the
        stats stored on it are already final — nothing has to re-derive
        them later. Bonuses from multiple permanents stack. */
    function addCreatureToBattlefield(rolled, manaCost) {
      const bonus = getCreatureEntryBonus();
      const power = rolled.power + bonus.power;
      const toughness = rolled.toughness + bonus.toughness;
      const abilities = [...rolled.abilities];
      bonus.abilities.forEach(a => { if (!abilities.includes(a)) abilities.push(a); });

      const hasteFlag = abilities.includes("Haste") ? true : Math.random() < 0.2;
      gameState.creatures.push({
        id: nextCreatureId++,
        power: power,
        toughness: toughness,
        summonedThisTurn: true,
        hasHaste: hasteFlag,
        attackTarget: null,
        tapped: false,
        stunCounters: 0,
        description: `${power}/${toughness} creature`,
        abilities: abilities,
        colors: rolled.colors,
        manaCost: manaCost,
        sizeTier: rolled.sizeTier,
        iconId: pickRandom(CREATURE_ICON_IDS)
      });
      gameState.voraxusCreatureCount = gameState.creatures.length;
      flashCreature(gameState.creatures[gameState.creatures.length - 1].iconId, rolled.colors);

      if (bonus.power || bonus.toughness || bonus.abilities.length) {
        const parts = [];
        if (bonus.power || bonus.toughness) parts.push(`+${bonus.power}/+${bonus.toughness}`);
        if (bonus.abilities.length) parts.push(joinAbilitiesForDisplay(bonus.abilities));
        logVoraxusAction(`It enters with ${parts.join(" and ")} from ${gameState.botName}'s permanents.`);
      }

      // Sanctum of Renewal and anything else keyed to casting a creature.
      firePermanentTrigger("creatureCast");
    }

    /** Removes Voraxus's own creatures AND artifacts/enchantments
        matching targetTypes, which may be a single type name or (for a
        multi-type board wipe) an array of them — a permanent is removed
        if it matches ANY of the given types. effect===0 respects
        Indestructible (Destroy only, and only creatures can have it);
        any other value bypasses it (Sacrifice, Bounce, Exile all do, in
        real MTG rules). Kept under its original name despite now
        covering more than creatures, so the four existing call sites
        (Destroy/Sacrifice/Bounce/Exile's wipe branches) didn't all need
        renaming too. */
    /** Removes Voraxus's own permanents matching targetTypes.
        Everything in gameState.creatures IS a creature, so this checks
        the type list directly rather than substring-matching each
        creature's description text — the old approach silently failed,
        because the type names are capitalised ("Creature") while
        descriptions read "3/4 creature", so a wipe never actually
        removed anything. Indestructible is likewise read from the
        abilities array rather than sniffed out of the description. */
    function removeCreaturesByType(targetTypes, effect) {
      const types = Array.isArray(targetTypes) ? targetTypes : [targetTypes];
      const hitsCreatures = types.some(t => String(t).toLowerCase() === "creature");
      const before = gameState.creatures.length;

      let commanderHit = false;
      if (hitsCreatures) {
        // The commander is pulled out first so a wipe sends it to the
        // command zone (rule 903.9) rather than removing it outright.
        commanderHit = gameState.creatures.some(c => c.isCommander);
        gameState.creatures = gameState.creatures.filter(c => {
          if (c.isCommander) return true;
          // effect 0 is Destroy, the only one Indestructible stops
          // (rule 702.12b); sacrifice, bounce and exile all bypass it.
          const isProtected = effect === 0 && (c.abilities || []).includes("Indestructible");
          return isProtected;
        });
        gameState.voraxusCreatureCount = gameState.creatures.length;
      }

      gameState.artifactsAndEnchantments = gameState.artifactsAndEnchantments.filter(item => !types.includes(item.type));

      let removed = before - gameState.creatures.length;
      if (commanderHit) {
        returnCommanderToCommandZone("caught in a sweep");
        removed++;
      }
      // Soul Furnace and anything else keyed to creatures leaving —
      // passed the count, so wiping four creatures triggers four times.
      firePermanentTrigger("creatureLeaves", removed);
      updateStatus();
    }

    /* ------------------------------------------------------------------
     *  UI updates
     * ---------------------------------------------------------------- */
    function refreshActionButtonStates() {
      if (btnForceDiscardRef) btnForceDiscardRef.disabled = gameState.voraxusCards <= 0;
      if (btnRemoveManaRef) btnRemoveManaRef.disabled = gameState.voraxusCurrentMana <= 0;
      if (btnRemoveManaSourceRef) btnRemoveManaSourceRef.disabled = gameState.voraxusTotalMana <= 0;
    }

    /** Shows the hand limit beside the card count, but only when an
        opponent's spell has actually changed it — the plain default of
        7 needs no annotation. */
    function handLimitSuffix() {
      if (gameState.maxHandSizeOverride == null) return "";
      const max = gameState.maxHandSizeOverride;
      return `<span class="hand-limit" title="Maximum hand size">/${max}</span>`;
    }

    function updateStatus() {
      statusBar.innerHTML = `
        <div class="status-row">
          <span class="status-stat" title="Life"><span class="stat-icon" aria-hidden="true">&#10084;</span>${Math.max(0, gameState.voraxusLife)}</span>
          <span class="status-stat" title="Cards in hand"><span class="stat-icon" aria-hidden="true">&#127183;</span>${gameState.voraxusCards}${handLimitSuffix()}</span>
          <span class="status-stat" title="Library"><span class="stat-icon" aria-hidden="true">&#128218;</span>${gameState.voraxusLibrary}</span>
          <span class="status-stat" title="Mana"><span class="stat-icon" aria-hidden="true">&#128167;</span>${gameState.voraxusCurrentMana}/${gameState.voraxusTotalMana}</span>
          <span class="status-stat" title="Creatures"><span class="stat-icon" aria-hidden="true">&#128009;</span>${gameState.voraxusCreatureCount}</span>
          <span class="status-stat" title="Artifacts &amp; enchantments"><span class="stat-icon" aria-hidden="true">&#128274;</span>${gameState.artifactsAndEnchantments.length}</span>
          ${getColorStripesHTML()}
        </div>
      `;
      updateCommandZoneDisplay();
      updateCreaturesDisplay();
      updateArtifactsDisplay();
      refreshActionButtonStates();
      saveGameState();
    }

    /** Renders the command zone strip: who the commander is, where it
        currently is, and what the next cast would cost after tax. */
    function updateCommandZoneDisplay() {
      const c = gameState.commander;
      if (!commandZoneBar) return;
      if (!c) {
        commandZoneBar.style.display = "none";
        return;
      }
      commandZoneBar.style.display = "block";
      const onField = c.zone === "battlefield";
      const tier = COMMANDER_BY_DIFFICULTY[c.tier] || COMMANDER_BY_DIFFICULTY[1];
      const zoneTag = onField
        ? `<span class="cmd-zone-tag on-field">On the battlefield</span>`
        : `<span class="cmd-zone-tag">Command zone &mdash; next cast ${commanderCastCost()}</span>`;
      const keywords = c.abilities.length
        ? `<span>${joinAbilitiesForDisplay(c.abilities)}</span>`
        : `<span class="cmd-vanilla">no keyword abilities</span>`;
      const passiveText = tier.passive
        ? `<div class="cmd-passive${onField ? "" : " inactive"}">${tier.passive.text}${onField ? "" : " <em>(inactive in the command zone)</em>"}</div>`
        : "";
      commandZoneBar.innerHTML = `
        <div class="cmd-row">
          <span class="stat-icon" aria-hidden="true">&#128081;</span>
          <span class="cmd-name">${c.name}</span>
          <span class="status-stat">${c.power}/${c.toughness}</span>
          ${keywords}
          ${zoneTag}
          ${c.castCount > 0 ? `<span class="cmd-zone-tag">Cast ${c.castCount}&times;</span>` : ""}
        </div>
        ${passiveText}
      `;
    }

    /** A small status tag shown on each creature card: which player it's
        attacking this combat, that it's summoning sick, or that combat
        just hasn't happened yet this turn. This tag is also what tells
        a creature apart as new-this-turn vs. an older one, now that
        they all share a single list — no separate box needed for that. */
    function getAttackStatusHTML(creature) {
      const stun = creature.stunCounters > 0
        ? `<span class="attack-tag stun">Stun &times;${creature.stunCounters}</span>`
        : "";
      if (creature.summonedThisTurn && !creature.hasHaste) {
        return `${stun}<span class="attack-tag sick">Summoning sick</span>`;
      }
      if (creature.attackTarget != null) {
        // Say it outright either way. Attacking taps a creature unless
        // it has Vigilance, and leaving the normal case unlabelled made
        // it look like tapping hadn't happened.
        const tapNote = creature.tapped
          ? " &mdash; tapped"
          : " &mdash; untapped (Vigilance)";
        return `${stun}<span class="attack-tag">Attacking Player ${creature.attackTarget}${tapNote}</span>`;
      }
      if (creature.tapped) {
        return `${stun}<span class="attack-tag tapped">Tapped</span>`;
      }
      return `${stun}<span class="attack-tag unassigned">Not yet assigned</span>`;
    }

    /** Persistent per-ability badges, shown at all times rather than
        buried in the description text — a creature with 3 abilities
        gets 3 separate tags. Defaults to an empty list for creatures
        from a save made before this field existed. */
    function getAbilityBadgesHTML(creature) {
      return (creature.abilities || []).map(a => `<span class="ability-tag">${a}</span>`).join("");
    }

    function renderCreatureList(title, creatures, emptyMessage) {
      if (creatures.length === 0) {
        return `<h2>${title}</h2><p>${emptyMessage}</p>`;
      }
      const items = creatures
        .map(creature => {
          const accentColor = COLOR_MAP[creature.colors[0]] || "#999999";
          const newClass = creature.summonedThisTurn ? " is-new" : "";
          // Fall back to deriving the cost for creatures from a save
          // made before manaCost was stored on them, matching the same
          // formula the bounce handler uses.
          const cost = creature.manaCost != null
            ? creature.manaCost
            : Math.floor((creature.power + creature.toughness) / 2);
          return `<li class="creature-item${newClass}" style="--creature-color:${accentColor}" data-id="${creature.id}">` +
            `${getCreatureIconSVG(creature.iconId)}` +
            `<span class="creature-text">${creature.description} <span class="creature-cost" title="Mana value">${cost}</span><br>` +
            `${getAbilityBadgesHTML(creature)}${getAttackStatusHTML(creature)}</span>` +
            `${getCreatureColorSquaresHTML(creature.colors)}</li>`;
        })
        .join("");
      return `<h2>${title}</h2><ul class="creature-list">${items}</ul>`;
    }

    function updateCreaturesDisplay() {
      // Newest first (matches where "new creatures" used to sit, back
      // when they had their own separate box), oldest last.
      const ordered = [...gameState.creatures].sort((a, b) => (b.summonedThisTurn ? 1 : 0) - (a.summonedThisTurn ? 1 : 0));
      creaturesBox.innerHTML = renderCreatureList("Creatures", ordered, "No creatures on the battlefield.");
    }

    /** Renders the artifacts & enchantments box — newest first, each
        showing its mana cost and its full standing-effect text, so the
        box doubles as a live reference for what's currently in play
        (including the two table-enforced ones the app can't automate). */
    function updateArtifactsDisplay() {
      const items = gameState.artifactsAndEnchantments;
      if (items.length === 0) {
        artifactsBox.innerHTML = `<h2>Artifacts &amp; Enchantments</h2><p>None on the battlefield.</p>`;
        return;
      }
      const ordered = [...items].reverse();
      const rows = ordered
        .map(item => {
          const def = findPermanentDefinition(item.name);
          const icon = item.type === "Artifact" ? "&#9881;" : "&#10024;";
          const cost = item.manaCost != null ? item.manaCost : (def ? def.cost : "?");
          const manual = def && def.trigger === "reminder"
            ? ` <span class="permanent-manual">(track manually)</span>`
            : "";
          const effect = def ? `<span class="permanent-effect">${def.text}</span>` : "";
          return `<li class="permanent-item" data-id="${item.id}">` +
            `<span class="permanent-icon" aria-hidden="true">${icon}</span>` +
            `<span class="permanent-text"><strong>${item.name}</strong> ` +
            `<span class="permanent-cost">${cost}</span>${manual}<br>` +
            `<span class="permanent-type">${item.type}</span><br>${effect}</span></li>`;
        })
        .join("");
      artifactsBox.innerHTML = `<h2>Artifacts &amp; Enchantments</h2><ul class="permanent-list">${rows}</ul>`;
    }

    /* ------------------------------------------------------------------
     *  Button helper
     * ---------------------------------------------------------------- */
    function createButton(label, onClick) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "button";
      btn.textContent = label;
      btn.onclick = onClick;
      return btn;
    }

    /* ------------------------------------------------------------------
     *  Game setup (configuration screen)
     * ---------------------------------------------------------------- */
    function showConfigScreen() {
      setMusicTrack(INTRO_TRACK);

      configBox.innerHTML = `
        <div><h2>Game Configuration</h2></div>
        <div>
          <label for="numPlayersInput">Number of Players:</label>
          <input type="number" id="numPlayersInput" value="1" min="1" />
        </div>
        <div id="lifePreview">${gameState.botName} starts with <strong>${startingLifeForPlayers(1)}</strong> life.</div>
        <div>
          <label for="librarySizeInput">${gameState.botName}'s Library Size:</label>
          <input type="number" id="librarySizeInput" value="100" min="1" />
        </div>
        <div>
          <label for="difficultySelect">Select Difficulty:</label>
          <select id="difficultySelect">
            <option value="1">I'm Too Young to Die (0 mana total, 7 cards, discards to 7)</option>
            <option value="2">Hurt Me Plenty (0 mana total, 7 cards, discards to 7)</option>
            <option value="3">Ultra-Violence (3 mana total, 7 cards, discards to 7)</option>
            <option value="4">Nightmare (5 mana total, 9 cards, max hand 13)</option>
            <option value="5">Ultra-Nightmare (10 mana total, 12 cards, no hand limit)</option>
          </select>
        </div>
        <div><button id="startGameBtn" class="button button-accent" type="button">Start Game</button></div>
      `;

      // Life now depends on the player count rather than difficulty, so
      // show the resulting total live as that number is changed.
      const playersInput = document.getElementById("numPlayersInput");
      const lifePreview = document.getElementById("lifePreview");
      playersInput.oninput = () => {
        const n = parseInt(playersInput.value, 10);
        const players = Number.isInteger(n) && n > 0 ? n : 1;
        lifePreview.innerHTML = `${gameState.botName} starts with <strong>${startingLifeForPlayers(players)}</strong> life.`;
      };

      document.getElementById("startGameBtn").onclick = () => {
        const numPlayersRaw = parseInt(document.getElementById("numPlayersInput").value, 10);
        gameState.numPlayers = Number.isInteger(numPlayersRaw) && numPlayersRaw > 0 ? numPlayersRaw : 1;

        const librarySizeRaw = parseInt(document.getElementById("librarySizeInput").value, 10);
        gameState.voraxusLibrary = Number.isInteger(librarySizeRaw) && librarySizeRaw > 0 ? librarySizeRaw : 100;

        const difficultyRaw = parseInt(document.getElementById("difficultySelect").value, 10);
        gameState.difficultyMode = DIFFICULTY_PRESETS[difficultyRaw] ? difficultyRaw : 1;

        const preset = DIFFICULTY_PRESETS[gameState.difficultyMode];
        const startingLife = startingLifeForPlayers(gameState.numPlayers);
        gameState.voraxusTotalMana = preset.totalMana;
        gameState.voraxusLife = startingLife;
        gameState.voraxusCards = 0;
        gameState.lifeHistory = [startingLife];
        gameState.actionTally = {};

        gameState.voraxusColors = randomizeVoraxusColors();
        gameState.voraxusCurrentMana = gameState.voraxusTotalMana;
        gameState.creatures = [];
        gameState.voraxusCreatureCount = 0;
        gameState.artifactsAndEnchantments = [];
        gameState.bouncedCards = [];
        gameState.maxHandSizeOverride = null;
        nextCreatureId = 1;
        nextPermanentId = 1;

        // Rules 903.5a / 903.6: the commander is one of the deck's 100
        // cards and starts in the command zone, so it comes out of the
        // library before the opening hand is drawn. A 100-card deck at
        // difficulty 1 therefore leaves 99 in the library, then 92 after
        // the seven-card opening hand.
        gameState.commander = buildCommander();
        gameState.voraxusLibrary = Math.max(0, gameState.voraxusLibrary - 1);

        undoStack.length = 0;
        refreshUndoButtonState();

        setMusicTrack(buildColorTrack(gameState.voraxusColors));

        configBox.style.display = "none";
        statusBar.style.display = "block";
        showMainMenu();
        drawVoraxusCards(preset.cards);
        updateStatus();
        logMessage(`${gameState.botName} has awoken!`);
        logMessage(`Its commander is <b>${gameState.commander.name}</b> — ${gameState.commander.power}/${gameState.commander.toughness}, ${joinAbilitiesForDisplay(gameState.commander.abilities)}. Cost ${commanderCastCost()}.`);
      };
    }

    /** Shown on load if a saved game is found, letting the player resume or start over. */
    function showResumeScreen(saved) {
      setMusicTrack(INTRO_TRACK);

      configBox.innerHTML = `
        <h2>Saved Game Found</h2>
        <p>Continue where you left off, or start a new game?</p>
        <button id="resumeBtn" class="button button-accent" type="button">Resume Game</button>
        <button id="newGameBtn" class="button" type="button">New Game</button>
      `;

      document.getElementById("resumeBtn").onclick = () => {
        Object.assign(gameState, saved.state);
        // A save made before Stats (or the library, or artifacts and
        // enchantments) existed won't have these fields — default them
        // rather than leaving things broken.
        if (!Array.isArray(gameState.lifeHistory)) gameState.lifeHistory = [gameState.voraxusLife];
        if (!gameState.actionTally || typeof gameState.actionTally !== "object") gameState.actionTally = {};
        if (!Number.isInteger(gameState.voraxusLibrary)) gameState.voraxusLibrary = 100;
        if (!Array.isArray(gameState.artifactsAndEnchantments)) gameState.artifactsAndEnchantments = [];
        if (!Array.isArray(gameState.bouncedCards)) gameState.bouncedCards = [];
        if (!gameState.commander) gameState.commander = buildCommander();
        if (gameState.maxHandSizeOverride === undefined) gameState.maxHandSizeOverride = null;
        recalculateNextCreatureId();
        recalculateNextPermanentId();
        logEntries.length = 0;
        logEntries.push(...(saved.log || []));
        renderLogFromEntries();

        setMusicTrack(buildColorTrack(gameState.voraxusColors));

        configBox.style.display = "none";
        statusBar.style.display = "block";
        renderMainMenuButtons();
        logMessage(`${gameState.botName} continues the battle!`);
      };

      document.getElementById("newGameBtn").onclick = () => {
        clearSavedGame();
        showConfigScreen();
      };
    }

    /* ------------------------------------------------------------------
     *  Bounced cards (returned to Voraxus's hand, recastable later)
     * ---------------------------------------------------------------- */
    /** Finds a matching card in the bounced pool WITHOUT removing it, so
        the caller can decide whether recasting is actually the better
        play before committing (see shouldRecastCreature). kind is
        "creature", "Artifact" or "Enchantment"; sizeTier only applies to
        creatures, so a bounced big creature comes back via the
        big-creature action rather than the small one. Returns
        { index, entry } or null. */
    function peekBouncedCard(kind, sizeTier) {
      const index = gameState.bouncedCards.findIndex(entry =>
        entry.kind === kind && (kind !== "creature" || entry.rolled.sizeTier === sizeTier));
      return index === -1 ? null : { index, entry: gameState.bouncedCards[index] };
    }

    /** Pulls the card at that index out of the pool. Deliberately does
        NOT touch voraxusCards: the card count is handled by the single
        spendCard() at the end of handleOutcome, the same as for a
        freshly-rolled card. (An earlier version decremented here too,
        which double-charged a recast two cards instead of one.) */
    function removeBouncedCardAt(index) {
      const [entry] = gameState.bouncedCards.splice(index, 1);
      return entry;
    }

    /** Puts a bounced card back after a failed recast attempt, so it
        isn't silently lost. Also leaves voraxusCards alone — that path
        returns before spendCard() runs, so nothing was charged. */
    function returnBouncedCard(entry) {
      gameState.bouncedCards.push(entry);
    }

    /** Whether recasting a specific bounced creature actually beats
        rolling a fresh one. Two things genuinely matter here:

        1. AFFORDABILITY. A recast costs exactly what the card cost
           originally, and that's fixed. If Voraxus can't pay it, the
           whole action is wasted — whereas a fresh roll might come up
           cheap enough to actually resolve. So an unaffordable bounced
           card is always skipped in favour of rolling.

        2. QUALITY vs. THE AVERAGE ROLL. Stats are rolled uniformly
           (1..6 small, 1..12 large at neutral color bias), so a fresh
           creature's expected power+toughness is about 7 small / 13
           large. Recasting a bounced creature below that average would
           be locking in a known-bad card when an average roll beats it;
           at or above it, the known card is the better bet.

        What ISN'T worth optimizing: raw mana efficiency. Cost is
        derived from stats (roughly half of power+toughness), so a
        bigger creature costs proportionally more and every creature
        lands near the same ~2 stats per mana. There's no free lunch to
        find there, which is why this only checks affordability and
        above/below-average quality rather than trying to compute some
        finer value ratio. */
    function shouldRecastCreature(entry, sizeTier) {
      if (entry.manaCost > gameState.voraxusCurrentMana) return false;
      const expectedFreshTotal = sizeTier === "large" ? 13 : 7;
      return (entry.rolled.power + entry.rolled.toughness) >= expectedFreshTotal;
    }

    /* ------------------------------------------------------------------
     *  Artifacts & Enchantments
     * ---------------------------------------------------------------- */
    /* Every permanent here is a STANDING effect, not a one-shot: casting
       it puts it on the battlefield, and it then keeps paying off
       whenever its trigger fires. Triggers used:

         turnStart          - start of each of Voraxus's turns
         creatureCast       - whenever Voraxus casts a creature
         combatDamageTaken  - whenever Voraxus is dealt combat damage
         creatureLeaves     - whenever a Voraxus creature leaves play
         opponentAttacks    - whenever opponents attack Voraxus
         reminder           - table-enforced; the app can't verify it
                              (these tax the PLAYERS' mana, which lives
                              outside the app), so it just sits in the
                              box as a standing reminder

       creatureMod entries modify each creature AS IT IS CAST rather than
       acting as a continuous anthem. That's a real difference from a
       true MTG anthem — creatures already on the battlefield don't
       retroactively grow — but it's honest, it stacks correctly when
       Voraxus has two of them, and it avoids re-deriving every
       creature's stats from scratch on every board change. */
    const ARTIFACT_POOL = [
      { name: "Mana Cache", cost: 2, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, it gains 1 extra mana.",
        run: () => { gameState.voraxusTotalMana += 1; gameState.voraxusCurrentMana += 1; return "gains 1 extra mana"; } },
      { name: "Warforged Claw", cost: 2, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with +1/+0.",
        creatureMod: { power: 1, toughness: 0 } },
      { name: "Scrying Lens", cost: 3, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, it draws an extra card.",
        run: () => { drawVoraxusCards(1); return "draws an extra card"; } },
      { name: "Spike Collar", cost: 3, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with Deathtouch.",
        creatureMod: { abilities: ["Deathtouch"] } },
      { name: "Obsidian Bulwark", cost: 4, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with +0/+3.",
        creatureMod: { power: 0, toughness: 3 } },
      { name: "Soul Furnace", cost: 4, trigger: "creatureLeaves",
        text: "Whenever a creature Voraxus controls leaves the battlefield, Voraxus gains 3 life.",
        run: (count) => { const gain = 3 * count; gameState.voraxusLife += gain; pushLifeHistory(); return `gains ${gain} life`; } },
      { name: "Reforging Anvil", cost: 5, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, if it controls fewer than two creatures, it summons a 2/2.",
        run: () => {
          if (gameState.creatures.length >= 2) return null;
          addCreatureToBattlefield({ power: 2, toughness: 2, abilities: [], colors: gameState.voraxusColors.length ? [gameState.voraxusColors[0]] : ["Colorless"], description: "2/2 creature", sizeTier: "small" }, 0);
          return "summons a 2/2";
        } },
      { name: "Siphon Core", cost: 5, trigger: "combatDamageTaken",
        text: "Whenever Voraxus is dealt combat damage, it gains 2 mana.",
        run: () => { gameState.voraxusTotalMana += 2; gameState.voraxusCurrentMana += 2; return "gains 2 mana"; } },
      { name: "Doom Beacon", cost: 6, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, each opponent loses 3 life.",
        run: () => "each opponent loses 3 life" },
      { name: "Titan Forge", cost: 7, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, Voraxus summons a 4/4 with Trample.",
        run: () => {
          addCreatureToBattlefield({ power: 4, toughness: 4, abilities: ["Trample"], colors: gameState.voraxusColors.length ? [gameState.voraxusColors[0]] : ["Colorless"], description: "4/4 creature", sizeTier: "large" }, 0);
          return "summons a 4/4 with Trample";
        } }
    ];

    const ENCHANTMENT_POOL = [
      { name: "Ritual Binding", cost: 2, trigger: "turnStart",
        text: "At the start of each of Voraxus's turns, it gains 2 life.",
        run: () => { gameState.voraxusLife += 2; pushLifeHistory(); return "gains 2 life"; } },
      { name: "Anthem of Fangs", cost: 3, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with +1/+1.",
        creatureMod: { power: 1, toughness: 1 } },
      { name: "Vow of Thorns", cost: 3, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with Trample.",
        creatureMod: { abilities: ["Trample"] } },
      { name: "Creeping Dread", cost: 4, trigger: "opponentAttacks",
        text: "Whenever an opponent attacks Voraxus, that opponent loses 3 life.",
        run: () => "the attacking opponent loses 3 life" },
      { name: "Blood Pact", cost: 4, trigger: "draw",
        text: "Whenever Voraxus draws a card, each opponent loses 1 life.",
        run: (count) => `each opponent loses ${count} life` },
      { name: "Wrathful Skies", cost: 5, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with Flying and +1/+0.",
        creatureMod: { power: 1, toughness: 0, abilities: ["Flying"] } },
      { name: "Sanctum of Renewal", cost: 5, trigger: "creatureCast",
        text: "Whenever Voraxus casts a creature, it gains 5 life.",
        run: () => { gameState.voraxusLife += 5; pushLifeHistory(); return "gains 5 life"; } },
      { name: "Toll of Battle", cost: 6, trigger: "reminder",
        text: "Each opponent pays 2 mana for each creature they attack Voraxus with." },
      { name: "Endless Swarm", cost: 6, trigger: "creatureCast",
        text: "Each creature Voraxus casts enters with +3/+3.",
        creatureMod: { power: 3, toughness: 3 } },
      { name: "Oppressive Silence", cost: 7, trigger: "reminder",
        text: "Each opponent pays 2 extra mana for each spell they cast." }
    ];

    /** Looks up a permanent's definition by name, across both pools. */
    function findPermanentDefinition(name) {
      return ARTIFACT_POOL.find(a => a.name === name) || ENCHANTMENT_POOL.find(e => e.name === name) || null;
    }

    /** Every definition currently on Voraxus's battlefield matching a
        given trigger, in the order they were cast. */
    function activePermanentsWithTrigger(trigger) {
      const defs = gameState.artifactsAndEnchantments
        .map(p => findPermanentDefinition(p.name))
        .filter(def => def && def.trigger === trigger);

      // The commander's passive uses the same trigger vocabulary, so it
      // simply joins the list — that makes its "enters with" bonuses
      // stack with any anthems automatically, with no special-casing.
      const passive = commanderPassive();
      if (passive && passive.trigger === trigger) {
        defs.push({
          name: gameState.commander.name,
          trigger: passive.trigger,
          text: passive.text,
          creatureMod: passive.creatureMod,
          run: passive.run
        });
      }
      return defs;
    }

    /** Runs every permanent with this trigger and logs what each did.
        `count` is passed through to run() for triggers that can fire
        more than once at a time (e.g. drawing 3 cards, or a board wipe
        removing 4 creatures at once). */
    function firePermanentTrigger(trigger, count) {
      const n = count == null ? 1 : count;
      if (n <= 0) return;
      activePermanentsWithTrigger(trigger).forEach(def => {
        const result = def.run ? def.run(n) : null;
        if (result) logVoraxusAction(`${def.name}: ${gameState.botName} ${result}.`);
      });
    }

    /** The combined "enters with" bonus from every creatureCast
        permanent Voraxus controls — stacks when it has more than one. */
    function getCreatureEntryBonus() {
      const bonus = { power: 0, toughness: 0, abilities: [] };
      activePermanentsWithTrigger("creatureCast").forEach(def => {
        if (!def.creatureMod) return;
        bonus.power += def.creatureMod.power || 0;
        bonus.toughness += def.creatureMod.toughness || 0;
        (def.creatureMod.abilities || []).forEach(a => {
          if (!bonus.abilities.includes(a)) bonus.abilities.push(a);
        });
      });
      return bonus;
    }

    /* ------------------------------------------------------------------
     *  Random outcome logic (Voraxus' main/post-combat actions)
     * ---------------------------------------------------------------- */
    /** Records an action in the Stats tally and, for anything other than
        a deliberate pass, fires the roar and screen shake. Called only
        once an action has actually resolved — a branch that bailed on
        cost never reaches here, so it neither shows up in the stats as
        that action nor announces itself with a roar the opponents
        shouldn't be hearing. */
    function resolveAction(branch) {
      gameState.actionTally[branch] = (gameState.actionTally[branch] || 0) + 1;
      if (branch === "A") return;
      playMonsterRoar();
      triggerScreenShake();
    }

    function handleOutcome() {
      if (gameState.voraxusCards <= 0) {
        // No cards to act with: a pass, recorded as one.
        gameState.actionTally.A = (gameState.actionTally.A || 0) + 1;
        logVoraxusAction(`${gameState.botName} does nothing.`);
        return;
      }

      // Voraxus's own colors bias which category of action comes up, in
      // keeping with the Commander color pie — see the affinity table
      // above. A colorless Voraxus gets perfectly even odds, identical to
      // this game's original behavior.
      const affinity = getColorAffinity(gameState.voraxusColors);

      // Casting the commander takes priority over rolling a random
      // action: it's the single strongest card Voraxus has, and it can
      // only ever be answered temporarily (rule 903.9), so a thin board
      // plus enough mana to pay the tax makes it the clear play.
      if (shouldCastCommander()) {
        const cost = commanderCastCost();
        pushUndoSnapshot();
        gameState.voraxusCurrentMana -= cost;
        putCommanderOntoBattlefield();
        spendCard();
        gameState.actionTally.CMD = (gameState.actionTally.CMD || 0) + 1;
        playMonsterRoar();
        triggerScreenShake();
        logVoraxusAction(`${gameState.botName} casts its commander, ${gameState.commander.name} (${cost} mana).`);
        firePermanentTrigger("creatureCast");
        updateStatus();
        return;
      }

      const weights = computeActionWeights(affinity, gameState.creatures.length > 0, gameState.difficultyMode, gameState.numPlayers);
      const { J: jWeight, K: kWeight } = splitCreatureWeight(weights.JK, affinity.bigness);
      let branch = weightedPick({
        A: weights.A, B: weights.B, C: weights.C, D: weights.D, E: weights.E,
        F: weights.F, G: weights.G, I: weights.I,
        J: jWeight, K: kWeight, L: weights.L, M: weights.M, N: weights.N, O: weights.O,
        P: weights.P, Q: weights.Q
      });

      let manaCost = 0;
      let buffer = "";

      // Nothing is tallied or dramatised yet. A branch can still fail
      // on its cost below, and when it does the only thing that
      // visibly happened is "Voraxus does nothing" — so the roar, the
      // shake and the Stats tally all wait until an action actually
      // resolves. See resolveAction().

      // A: does nothing (no state change, so no undo snapshot needed).
      if (branch === "A") {
        buffer = `${gameState.botName} does nothing.`;
      } else {
        // Every other branch may mutate state, so snapshot first.
        pushUndoSnapshot();
      }

      // B: destruction
      if (branch === "B") {
        const outcome = rollRemovalOutcome();
        if (outcome.tier === "wipe") {
          manaCost = 4 + (outcome.count - 1) * 2 + (outcome.oneSided ? ONE_SIDED_WIPE_PREMIUM : 0);
          const types = pickMultiplePermanentTypes(outcome.count);
          buffer = `${gameState.botName} destroys all ${joinTypesForDisplay(types)}${wipeScopeSuffix(outcome.oneSided)}.`;
          if (checkAndDeductMana(manaCost)) {
            resolveAction(branch);
            logVoraxusAction(buffer);
            if (!outcome.oneSided) removeCreaturesByType(types, 0);
            spendCard();
            updateStatus();
          }
          return;
        }
        const high = outcome.which === "highest";
        const type = pickPermanentType();
        manaCost = (high ? 3 : 2) + (outcome.tier === "each" ? 1 : 0);
        buffer = `${gameState.botName} destroys target ${type} with ${high ? "highest" : "lowest"} mana value controlled by ${removalScopeLabel(outcome)}.`;
        if (!checkAndDeductMana(manaCost)) return;
      }
      // C: sacrifice. Three shapes, in rising order of how much choice
      // the OPPONENT gets:
      //   - Voraxus names which permanent (highest/lowest MV)
      //   - an edict: each opponent gives up 1-3 of something, but picks
      //     which ones themselves
      //   - a mass sacrifice: everyone loses whole permanent types
      //
      // Note these are deliberately NOT worded as "target", unlike the
      // destroy/bounce/exile branches: sacrifice never targets in real
      // MTG, which is exactly why edicts get around hexproof. Keeping
      // that distinction means hexproof genuinely protects against
      // Voraxus's removal but not against its sacrifice effects, same
      // as at a real table. Sacrifice also bypasses Indestructible, so
      // the mass branch passes a non-zero effect code.
      else if (branch === "C") {
        if (randomInt(100) < SACRIFICE_EDICT_CHANCE) {
          const edict = rollSacrificeEdict();
          manaCost = edict.manaCost;
          if (!checkAndDeductMana(manaCost)) return;
          buffer = `${gameState.botName} forces each opponent to sacrifice ${edict.count} ${edict.label} of their choosing.`;
        } else {
          const outcome = rollRemovalOutcome();
          if (outcome.tier === "wipe") {
            manaCost = 4 + (outcome.count - 1) * 2 + (outcome.oneSided ? ONE_SIDED_WIPE_PREMIUM : 0);
            const types = pickMultiplePermanentTypes(outcome.count);
            buffer = outcome.oneSided
              ? `${gameState.botName} forces each opponent to sacrifice their ${joinTypesForDisplay(types)}.`
              : `${gameState.botName} forces all players to sacrifice their ${joinTypesForDisplay(types)}.`;
            if (checkAndDeductMana(manaCost)) {
              resolveAction(branch);
              logVoraxusAction(buffer);
              if (!outcome.oneSided) removeCreaturesByType(types, 1);
              spendCard();
              updateStatus();
            }
            return;
          }
          const high = outcome.which === "highest";
          const type = pickPermanentType();
          manaCost = (high ? 3 : 2) + (outcome.tier === "each" ? 1 : 0);
          buffer = `${gameState.botName} commands ${removalScopeLabel(outcome)} to sacrifice ${type} with ${high ? "highest" : "lowest"} mana value.`;
          if (!checkAndDeductMana(manaCost)) return;
        }
      }
      // D: return to hand
      else if (branch === "D") {
        const outcome = rollRemovalOutcome();
        if (outcome.tier === "wipe") {
          manaCost = 3 + (outcome.count - 1) * 2 + (outcome.oneSided ? ONE_SIDED_WIPE_PREMIUM : 0);
          const types = pickMultiplePermanentTypes(outcome.count);
          buffer = `${gameState.botName} returns all ${joinTypesForDisplay(types)}${wipeScopeSuffix(outcome.oneSided)} to their owners' hands.`;
          if (checkAndDeductMana(manaCost)) {
            resolveAction(branch);
            logVoraxusAction(buffer);
            if (!outcome.oneSided) removeCreaturesByType(types, 1);
            spendCard();
            updateStatus();
          }
          return;
        }
        const high = outcome.which === "highest";
        const type = pickPermanentType();
        manaCost = (high ? 2 : 1) + (outcome.tier === "each" ? 1 : 0);
        buffer = `${gameState.botName} returns target ${type} with ${high ? "highest" : "lowest"} mana value controlled by ${removalScopeLabel(outcome)} to its owner's hand.`;
        if (!checkAndDeductMana(manaCost)) return;
      }
      // E: exile — also bypasses Indestructible, same as sacrifice.
      else if (branch === "E") {
        const outcome = rollRemovalOutcome();
        if (outcome.tier === "wipe") {
          manaCost = 5 + (outcome.count - 1) * 2 + (outcome.oneSided ? ONE_SIDED_WIPE_PREMIUM : 0);
          const types = pickMultiplePermanentTypes(outcome.count);
          buffer = `${gameState.botName} exiles all ${joinTypesForDisplay(types)}${wipeScopeSuffix(outcome.oneSided)}.`;
          if (checkAndDeductMana(manaCost)) {
            resolveAction(branch);
            logVoraxusAction(buffer);
            if (!outcome.oneSided) removeCreaturesByType(types, 1);
            spendCard();
            updateStatus();
          }
          return;
        }
        const high = outcome.which === "highest";
        const type = pickPermanentType();
        manaCost = (high ? 4 : 3) + (outcome.tier === "each" ? 1 : 0);
        buffer = `${gameState.botName} exiles target ${type} with ${high ? "highest" : "lowest"} mana value controlled by ${removalScopeLabel(outcome)}.`;
        if (!checkAndDeductMana(manaCost)) return;
      }
      // F: damage to a creature OR a planeswalker (players are handled
      // separately by G) — damage only meaningfully applies to
      // creatures, players, and planeswalkers in MTG, so this covers
      // the two of those three that aren't a direct player hit.
      //
      // It picks ONE of the two per cast rather than naming both every
      // time, which is how real damage spells work — most target a
      // creature or a planeswalker, not automatically both. Creature is
      // the more common choice, mirroring the same 7-to-4 ratio those
      // two types already have in PERMANENT_TYPE_WEIGHTS, so the split
      // is consistent with how removal picks its targets rather than
      // being a second, unrelated number.
      else if (branch === "F") {
        const outcomeRoll = randomInt(100);
        const dmg = randomInt(6) + 1;
        const player = randomInt(gameState.numPlayers) + 1;
        const target = weightedPick({ creature: 7, planeswalker: 3 });
        if (outcomeRoll < 40) {
          manaCost = dmg;
          buffer = `${gameState.botName} deals ${dmg} damage to target ${target} with highest mana value controlled by Player ${player}.`;
        } else if (outcomeRoll < 95) {
          manaCost = dmg;
          buffer = `${gameState.botName} deals ${dmg} damage to target ${target} with lowest mana value controlled by Player ${player}.`;
        } else {
          manaCost = 2 + dmg;
          buffer = `${gameState.botName} deals ${dmg} damage to all ${target}s.`;
        }
        if (!checkAndDeductMana(manaCost)) return;
      }
      // G: damage to players
      else if (branch === "G") {
        const outcomeRoll = randomInt(100);
        const dmg = randomInt(6) + 1;
        const player = randomInt(gameState.numPlayers) + 1;
        if (outcomeRoll < 70) {
          manaCost = dmg;
          buffer = `${gameState.botName} deals ${dmg} damage to Player ${player}.`;
        } else {
          manaCost = 2 + dmg;
          buffer = `${gameState.botName} deals ${dmg} damage to all players.`;
        }
        if (!checkAndDeductMana(manaCost)) return;
      }
      // I: exiles graveyards
      else if (branch === "I") {
        manaCost = 3;
        if (!checkAndDeductMana(manaCost)) return;
        buffer = `${gameState.botName} exiles all graveyards.`;
      }
      // J: small creature. If an opponent previously bounced a small
      // creature back to Voraxus's hand, it recasts that exact card
      // (same stats, abilities and cost) when doing so is actually the
      // better play — see shouldRecastCreature() for what "better"
      // means here.
      else if (branch === "J") {
        const found = peekBouncedCard("creature", "small");
        const recast = found && shouldRecastCreature(found.entry, "small")
          ? removeBouncedCardAt(found.index)
          : null;
        if (recast) {
          manaCost = recast.manaCost;
          if (!checkAndDeductMana(manaCost)) {
            returnBouncedCard(recast);
            return;
          }
          addCreatureToBattlefield(recast.rolled, recast.manaCost);
          buffer = `${gameState.botName} recasts the ${recast.rolled.power}/${recast.rolled.toughness} creature with ${joinAbilitiesForDisplay(recast.rolled.abilities)} that was returned to its hand.`;
        } else {
          const rolled = rollCreature("small");
          manaCost = Math.floor((rolled.power + rolled.toughness) / 2);
          if (!checkAndDeductMana(manaCost)) return;
          addCreatureToBattlefield(rolled, manaCost);
          buffer = `${gameState.botName} summons a ${rolled.power}/${rolled.toughness} creature with ${joinAbilitiesForDisplay(rolled.abilities)} onto the battlefield.`;
        }
      }
      // K: large creature — same recast decision as J above.
      else if (branch === "K") {
        const found = peekBouncedCard("creature", "large");
        const recast = found && shouldRecastCreature(found.entry, "large")
          ? removeBouncedCardAt(found.index)
          : null;
        if (recast) {
          manaCost = recast.manaCost;
          if (!checkAndDeductMana(manaCost)) {
            returnBouncedCard(recast);
            return;
          }
          addCreatureToBattlefield(recast.rolled, recast.manaCost);
          buffer = `${gameState.botName} recasts the ${recast.rolled.power}/${recast.rolled.toughness} creature with ${joinAbilitiesForDisplay(recast.rolled.abilities)} that was returned to its hand.`;
        } else {
          const rolled = rollCreature("large");
          manaCost = 3 + Math.floor((rolled.power + rolled.toughness) / 2);
          if (!checkAndDeductMana(manaCost)) return;
          addCreatureToBattlefield(rolled, manaCost);
          buffer = `${gameState.botName} summons a ${rolled.power}/${rolled.toughness} creature with ${joinAbilitiesForDisplay(rolled.abilities)} onto the battlefield.`;
        }
      }
      // L: draws cards
      else if (branch === "L") {
        manaCost = 2;
        if (!checkAndDeductMana(manaCost)) return;
        const cardsDrawn = randomInt(4) + 1;
        if (drawVoraxusCards(cardsDrawn)) {
          buffer = `${gameState.botName} draws ${cardsDrawn} card(s).`;
        }
      }
      // M: all opponents discard
      else if (branch === "M") {
        manaCost = 2;
        if (!checkAndDeductMana(manaCost)) return;
        buffer = `${gameState.botName} commands all opponents to discard a card.`;
      }
      // N: heals itself — 69% a small heal (1-10), 30% a medium heal
      // (11-20), and a rare 1% chance of a big 25-life surge.
      else if (branch === "N") {
        const healRoll = randomInt(10000);
        let healAmount;
        if (healRoll < 6900) {
          healAmount = randomInt(10) + 1; // 1-10, uniform
          manaCost = 2;
        } else if (healRoll < 9900) {
          healAmount = randomInt(10) + 11; // 11-20, uniform
          manaCost = 4;
        } else {
          healAmount = 25;
          manaCost = 6;
        }
        if (!checkAndDeductMana(manaCost)) return;
        gameState.voraxusLife += healAmount;
        pushLifeHistory();
        buffer = `${gameState.botName} heals itself for ${healAmount} life.`;
      }
      // O: empowers one of its own creatures, chosen at random, with
      // +X/+Y where X and Y are each independently 1-3. Only reachable
      // when Voraxus actually has a creature (see computeActionWeights).
      else if (branch === "O") {
        const target = pickRandom(gameState.creatures);
        const powerBoost = randomInt(3) + 1;
        const toughnessBoost = randomInt(3) + 1;
        manaCost = powerBoost + toughnessBoost;
        if (!checkAndDeductMana(manaCost)) return;

        target.power += powerBoost;
        target.toughness += toughnessBoost;
        target.description = target.description.replace(/^\d+\/\d+/, `${target.power}/${target.toughness}`);
        buffer = `${gameState.botName} empowers ${target.description} with +${powerBoost}/+${toughnessBoost}.`;
      }
      // P: casts an artifact, Q: an enchantment. Each permanent now has
      // its own real mana cost rather than a flat 3, and casting it just
      // puts it on the battlefield — its effect fires later, whenever its
      // trigger comes up (see the pools above). A bounced one is always
      // recast when in hand; unlike creatures there's no quality check,
      // since a recast and a fresh cast draw from the same pool.
      else if (branch === "P" || branch === "Q") {
        const type = branch === "P" ? "Artifact" : "Enchantment";
        const pool = branch === "P" ? ARTIFACT_POOL : ENCHANTMENT_POOL;
        const found = peekBouncedCard(type);
        const recast = found ? removeBouncedCardAt(found.index) : null;
        const def = recast ? findPermanentDefinition(recast.name) : pickRandom(pool);
        if (!def) {
          if (recast) returnBouncedCard(recast);
          return;
        }
        manaCost = def.cost;
        if (!checkAndDeductMana(manaCost)) {
          if (recast) returnBouncedCard(recast);
          return;
        }
        gameState.artifactsAndEnchantments.push({
          id: nextPermanentId++, type: type, name: def.name, manaCost: def.cost
        });
        buffer = `${gameState.botName} casts ${type.toLowerCase()} ${def.name}${recast ? " (recast from hand)" : ""} — ${def.text}`;
      }

      // Reaching here means the branch got past its cost check, so the
      // action really happened — tally it and let it announce itself.
      resolveAction(branch);

      if (buffer) {
        logVoraxusAction(buffer);
      }

      // "Does nothing" doesn't cost a card; every other outcome does.
      if (branch !== "A" || gameState.voraxusCards < 1) {
        spendCard();
      }
      updateStatus();
    }

    /* ------------------------------------------------------------------
     *  Opponent / utility actions
     * ---------------------------------------------------------------- */
    /** Records the current life total into the game's history, for the
        Stats dialog's sparkline. Capped at 200 points so a very long
        game doesn't grow the save file forever — that's far more
        resolution than a small sparkline can show anyway. */
    function pushLifeHistory() {
      if (!Array.isArray(gameState.lifeHistory)) gameState.lifeHistory = [];
      gameState.lifeHistory.push(gameState.voraxusLife);
      if (gameState.lifeHistory.length > 200) {
        gameState.lifeHistory.splice(0, gameState.lifeHistory.length - 200);
      }
    }

    async function checkVoraxusDefeat() {
      if (gameState.voraxusLife <= 0) {
        logMessage(`${gameState.botName} has been defeated!`);
        clearSavedGame();
        await showConfirmDialog(`${gameState.botName} has been defeated! Game Over.`, { okOnly: true, confirmLabel: "OK" });
        showMainMenu();
      }
    }

    /** Real MTG rule: attempting to draw from an empty library is a loss,
        checked as a state-based action the instant it's attempted — not
        "when your deck runs low," but the specific moment you try to
        draw the card that isn't there. Mirrors checkVoraxusDefeat()'s
        shape, just for this separate loss condition. */
    async function triggerVoraxusDeckOut() {
      logMessage(`${gameState.botName} attempts to draw from an empty library and loses the game!`);
      clearSavedGame();
      await showConfirmDialog(`${gameState.botName} tried to draw from an empty library and has lost the game — decked out!`, { okOnly: true, confirmLabel: "OK" });
      showMainMenu();
    }

    /** The single path every draw in the game goes through — the
        starting hand, the per-turn draw step, the random "L" action, and
        the manual Force Draw button all call this rather than touching
        voraxusCards directly, so the empty-library loss condition can
        never be missed at one of those sites. Draws one card at a time
        (rather than just subtracting n from the library in one go) so
        that drawing the LAST card in the library is still a completely
        legal draw — the loss only triggers on the NEXT attempt, once
        the library is actually empty, exactly matching the real rule.
        Returns false if Voraxus just lost this way, so a caller can
        stop whatever else it was about to do. */
    function drawVoraxusCards(n) {
      let drawn = 0;
      for (let i = 0; i < n; i++) {
        if (gameState.voraxusLibrary <= 0) {
          triggerVoraxusDeckOut();
          return false;
        }
        gameState.voraxusLibrary--;
        gameState.voraxusCards++;
        drawn++;
      }
      // Blood Pact and anything else keyed to drawing — passed the count
      // so a 3-card draw drains three times, not once.
      firePermanentTrigger("draw", drawn);
      return true;
    }

    async function handleDamage() {
      const damage = await showNumberPrompt(`Enter combat damage to be applied to ${gameState.botName}:`, { min: 0, defaultValue: 0 });
      if (damage === null || isNaN(damage) || damage < 0) return;

      pushUndoSnapshot();
      // A power curve whose strength and direction depend on difficulty
      // — see DAMAGE_CURVE_BY_DIFFICULTY above for the full reasoning.
      // Unlike a straight-line ramp, this traces a real curved shape at
      // every level except the flat middle: it hugs one end and bends
      // increasingly steeply toward the other, rather than approaching
      // it in a straight line.
      const curve = DAMAGE_CURVE_BY_DIFFICULTY[gameState.difficultyMode] || DAMAGE_CURVE_BY_DIFFICULTY[3];
      const raw = Math.pow(Math.random(), curve.exponent);
      const fraction = curve.flip ? 1 - raw : raw;
      const result = Math.floor(damage * fraction);
      logMessage(`${gameState.botName} takes ${result} combat damage.`);
      gameState.voraxusLife -= result;
      pushLifeHistory();
      logMessage(`${gameState.botName} now has ${Math.max(0, gameState.voraxusLife)} life remaining.`);

      // Applying combat damage means an opponent attacked, so anything
      // keyed to being attacked fires regardless of how much actually
      // landed; the damage-taken triggers only fire if some got through.
      firePermanentTrigger("opponentAttacks");
      if (result > 0) firePermanentTrigger("combatDamageTaken");

      checkVoraxusDefeat();
      updateStatus();
    }

    async function handleDirectDamage() {
      const damage = await showNumberPrompt(`Enter direct damage to be applied to ${gameState.botName}:`, { min: 0, defaultValue: 0 });
      if (damage === null || isNaN(damage) || damage < 0) return;

      pushUndoSnapshot();
      logMessage(`${gameState.botName} takes ${damage} direct damage.`);
      gameState.voraxusLife -= damage;
      pushLifeHistory();
      logMessage(`${gameState.botName} now has ${Math.max(0, gameState.voraxusLife)} life remaining.`);
      checkVoraxusDefeat();
      updateStatus();
    }

    /** Voraxus's current maximum hand size, or null for no limit.
        An override set by an opponent's spell wins over the difficulty
        default; otherwise difficulties 1-3 cap at 7 and 4-5 have no
        limit at all. */
    function effectiveMaxHandSize() {
      if (gameState.maxHandSizeOverride != null) return gameState.maxHandSizeOverride;
      if (gameState.difficultyMode >= 5) return null;      // no limit at all
      return gameState.difficultyMode === 4 ? 13 : 7;      // generous, but still a limit
    }

    /** Whether the difficulty itself already grants no maximum hand
        size — in which case there's nothing for a hand-size effect to
        reduce, so the button is hidden. */
    function difficultyHasNoHandLimit() {
      return gameState.difficultyMode >= 5;
    }

    async function handleSetMaxHandSize() {
      const current = effectiveMaxHandSize();
      const value = await showNumberPrompt(
        `Set ${gameState.botName}'s maximum hand size (currently ${current == null ? "unlimited" : current}):`,
        { min: 0, defaultValue: current == null ? 7 : current }
      );
      if (value === null || isNaN(value) || value < 0) {
        logMessage("Maximum hand size unchanged.");
        return;
      }

      pushUndoSnapshot();
      gameState.maxHandSizeOverride = value;
      logMessage(`${gameState.botName}'s maximum hand size is now ${value}. It applies at the end of its turn.`);
      updateStatus();
    }

    async function handleDiscardFromVoraxus() {
      const numToDiscard = await showNumberPrompt(`How many cards should ${gameState.botName} discard?`, { min: 1, defaultValue: 1 });
      if (numToDiscard === null || isNaN(numToDiscard) || numToDiscard <= 0) {
        logMessage("No cards discarded. (Must be a positive number.)");
        return;
      }

      pushUndoSnapshot();
      if (gameState.voraxusCards >= numToDiscard) {
        gameState.voraxusCards -= numToDiscard;
        logMessage(`Opponents force ${gameState.botName} to discard ${numToDiscard} card(s)!`);
      } else {
        const actuallyDiscarded = gameState.voraxusCards;
        gameState.voraxusCards = 0;
        logMessage(
          `Opponents wanted ${gameState.botName} to discard ${numToDiscard} cards, but it only had ${actuallyDiscarded}. ` +
          `${gameState.botName} discards all remaining cards!`
        );
      }
      updateStatus();
    }

    /** Mirror of handleDiscardFromVoraxus — for the (rarer, but real)
        case of an effect that makes an opponent draw, like a symmetric
        card-draw spell someone else controls. No lower-bound edge case
        to handle here the way discard has one, since there's no upper
        limit on hand size at draw time in Magic. */
    async function handleDrawFromVoraxus() {
      const numToDraw = await showNumberPrompt(`How many cards should ${gameState.botName} draw?`, { min: 1, defaultValue: 1 });
      if (numToDraw === null || isNaN(numToDraw) || numToDraw <= 0) {
        logMessage("No cards drawn. (Must be a positive number.)");
        return;
      }

      pushUndoSnapshot();
      if (drawVoraxusCards(numToDraw)) {
        logMessage(`Opponents force ${gameState.botName} to draw ${numToDraw} card(s)!`);
      }
      updateStatus();
    }

    /** For when an opponent's spell or ability gives Voraxus a creature
        directly (a Swan Song bird token, say), rather than Voraxus
        summoning one of its own. Builds the battlefield creature object
        directly rather than going through addCreatureToBattlefield,
        since that function has an extra ~20% chance of bonus Haste built
        in — flavor meant for Voraxus's own random summons, not for a
        precisely player-specified token, which should only skip
        summoning sickness when Haste was actually picked. */
    async function handleGiveCreature() {
      const result = await showGiveCreatureDialog();
      if (!result) return;

      const power = Math.max(0, result.power);
      const toughness = Math.max(0, result.toughness);
      const abilities = result.ability ? [result.ability] : [];
      const description = result.type ? `${power}/${toughness} ${result.type} creature` : `${power}/${toughness} creature`;

      pushUndoSnapshot();
      gameState.creatures.push({
        id: nextCreatureId++,
        power,
        toughness,
        summonedThisTurn: true,
        hasHaste: abilities.includes("Haste"),
        attackTarget: null,
        description,
        abilities,
        colors: [],
        iconId: pickRandom(CREATURE_ICON_IDS)
      });
      gameState.voraxusCreatureCount = gameState.creatures.length;
      flashCreature(gameState.creatures[gameState.creatures.length - 1].iconId, []);

      const abilityText = abilities.length ? ` with ${joinAbilitiesForDisplay(abilities)}` : "";
      logMessage(`${gameState.botName} is given a ${description}${abilityText}.`);
      updateStatus();
    }

    /** Delegated click handler on the creature boxes — tapping any creature
        card prompts to remove it, no separate "removal mode" needed. */
    async function handleCreatureTap(event) {
      const item = event.target.closest(".creature-item");
      if (!item) return;

      const id = parseInt(item.dataset.id, 10);
      const creature = gameState.creatures.find(c => c.id === id);
      if (!creature) return;

      const choice = await showRemovalDialog(`What happens to ${creature.description}?`);
      if (choice === "cancel") return;

      pushUndoSnapshot();

      // Stun counters don't remove the creature at all — rule 122.1d:
      // "If a permanent with a stun counter on it would become
      // untapped, instead remove a stun counter from it." So the
      // creature is tapped down and stays that way for an extra untap
      // step per counter. Counters stack.
      if (choice === "stun") {
        creature.stunCounters = (creature.stunCounters || 0) + 1;
        creature.tapped = true;
        creature.attackTarget = null;
        logMessage(
          `${creature.description} is tapped and given a stun counter ` +
          `(${creature.stunCounters} total). It will skip its next ` +
          `${creature.stunCounters === 1 ? "untap step" : `${creature.stunCounters} untap steps`}.`
        );
        updateStatus();
        return;
      }

      // Rule 903.9 — a commander leaving the battlefield for any zone
      // goes to the command zone instead, so it can never be answered
      // permanently; it just costs {2} more next time.
      if (creature.isCommander) {
        returnCommanderToCommandZone(choice === "bounce" ? "bounced" : "removed");
        firePermanentTrigger("creatureLeaves", 1);
        updateStatus();
        return;
      }
      gameState.creatures = gameState.creatures.filter(c => c.id !== id);
      gameState.voraxusCreatureCount = gameState.creatures.length;

      if (choice === "bounce") {
        // Back to hand rather than gone: card count goes up, and the
        // card itself is kept intact so Voraxus can recast this exact
        // creature later for its original cost.
        gameState.bouncedCards.push({
          kind: "creature",
          manaCost: creature.manaCost != null ? creature.manaCost : Math.floor((creature.power + creature.toughness) / 2),
          rolled: {
            power: creature.power,
            toughness: creature.toughness,
            abilities: creature.abilities || [],
            colors: creature.colors,
            description: creature.description,
            sizeTier: creature.sizeTier || "small"
          }
        });
        gameState.voraxusCards++;
        logMessage(`${creature.description} was returned to ${gameState.botName}'s hand.`);
      } else {
        logMessage(`${creature.description} removed from the battlefield.`);
      }
      // A bounce still counts as leaving the battlefield, so Soul
      // Furnace and friends trigger either way.
      firePermanentTrigger("creatureLeaves", 1);
      updateStatus();
    }

    /** Mirror of handleCreatureTap, for the artifacts/enchantments box. */
    async function handleArtifactTap(event) {
      const item = event.target.closest(".permanent-item");
      if (!item) return;

      const id = parseInt(item.dataset.id, 10);
      const permanent = gameState.artifactsAndEnchantments.find(p => p.id === id);
      if (!permanent) return;

      const choice = await showRemovalDialog(`What happens to ${permanent.name}?`);
      if (choice === "cancel") return;

      pushUndoSnapshot();
      gameState.artifactsAndEnchantments = gameState.artifactsAndEnchantments.filter(p => p.id !== id);

      if (choice === "bounce") {
        gameState.bouncedCards.push({
          kind: permanent.type,
          name: permanent.name,
          manaCost: permanent.manaCost != null ? permanent.manaCost : 3
        });
        gameState.voraxusCards++;
        logMessage(`${permanent.name} was returned to ${gameState.botName}'s hand.`);
      } else {
        logMessage(`${permanent.name} removed from the battlefield.`);
      }
      updateStatus();
    }

    async function handleRemoveMana() {
      const removeAmount = await showNumberPrompt("How much mana to remove from Voraxus?", { min: 1, defaultValue: 1 });
      if (removeAmount === null || isNaN(removeAmount) || removeAmount <= 0) {
        logMessage("No mana removed. (Must be a positive number.)");
        return;
      }

      pushUndoSnapshot();
      gameState.voraxusCurrentMana = Math.max(0, gameState.voraxusCurrentMana - removeAmount);
      logMessage(
        `Opponents remove ${removeAmount} from Voraxus's available mana. ` +
        `Now at ${gameState.voraxusCurrentMana}/${gameState.voraxusTotalMana}.`
      );
      updateStatus();
    }

    /** Removes mana SOURCES rather than available mana — the equivalent
        of destroying lands. Total capacity shrinks permanently, and
        available mana is only reduced if it would otherwise exceed the
        new total. So 4/7 losing one source becomes 4/6 (the 4 already
        available is still fine), while 7/7 losing one becomes 6/6,
        since there's no longer capacity for that seventh. */
    async function handleRemoveManaSource() {
      const removeAmount = await showNumberPrompt("How many mana sources to destroy?", { min: 1, defaultValue: 1 });
      if (removeAmount === null || isNaN(removeAmount) || removeAmount <= 0) {
        logMessage("No mana sources removed. (Must be a positive number.)");
        return;
      }
      if (gameState.voraxusTotalMana <= 0) {
        logMessage(`${gameState.botName} has no mana sources left to destroy.`);
        return;
      }

      pushUndoSnapshot();
      const actual = Math.min(removeAmount, gameState.voraxusTotalMana);
      gameState.voraxusTotalMana -= actual;
      gameState.voraxusCurrentMana = Math.min(gameState.voraxusCurrentMana, gameState.voraxusTotalMana);
      const shortfall = actual < removeAmount
        ? ` (only ${actual} source${actual === 1 ? "" : "s"} remained)`
        : "";
      logMessage(
        `Opponents destroy ${actual} of ${gameState.botName}'s mana sources${shortfall}. ` +
        `Now at ${gameState.voraxusCurrentMana}/${gameState.voraxusTotalMana}.`
      );
      updateStatus();
    }

    /** How often Voraxus actually has a counter available when its
        opponents check — entirely independent of the main A-O action
        pool now (see computeActionWeights above). Still shaped by color,
        the same affinity.H multiplier that used to apply inside the
        pool: Blue leans into this hard (1.9x), Green almost never has
        one (0.4x), matching the counterspell identity of the color pie.

        Also now scaled by difficulty: level 2 is the anchor at 5% (the
        deliberately-chosen baseline from before), each level above that
        multiplies by 1.3x on top of the level below it (so level 5 is
        1.3 cubed above level 2, not just 1.3 times level 2), and level 1
        is 0.77x of level 2 — the two together form a smooth, symmetric
        curve around that original 5% anchor rather than an arbitrary
        jump at one specific level. */
    const COUNTER_BASE_CHANCE_BY_DIFFICULTY = {
      1: 0.0385,
      2: 0.05,
      3: 0.065,
      4: 0.0845,
      5: 0.10985
    };

    /* Player count scales the counter chance the same way it scales
       "does nothing", but in the opposite direction: more opponents
       means more spells coming at Voraxus, so holding up an answer is
       worth more. Each extra seat adds 5% of the current value, and the
       effect stops counting past four players — the same cap used for
       the action weights, so the two stay consistent. */
    const COUNTER_PLAYER_STEP = 1.05;

    function counterScaleForPlayers(numPlayers) {
      const n = Number.isInteger(numPlayers) && numPlayers > 0 ? numPlayers : 1;
      return Math.pow(COUNTER_PLAYER_STEP, Math.min(n, A_PLAYER_CAP) - 1);
    }

    /** The mana cost of an actual counter, once one happens: usually
        cheap, occasionally pricier — 70% of the time 2 mana, 15% of the
        time 3, 15% of the time 4. Always exactly 1 card regardless of
        which mana tier hits. */
    function pickCounterManaCost() {
      const roll = Math.random();
      if (roll < 0.70) return 2;
      if (roll < 0.85) return 3;
      return 4;
    }

    /** "Check if Voraxus Responds" — its own independent check, no
        longer sharing weight with (or ever competing against) the main
        action pool. A pass/fail roll first (see
        COUNTER_BASE_CHANCE_BY_DIFFICULTY), and only on a pass does the
        mana-cost tier get rolled. */
    function handleCheckResponse() {
      if (gameState.voraxusCards <= 0) {
        logVoraxusAction(`${gameState.botName} has no response.`);
        return;
      }

      const affinity = getColorAffinity(gameState.voraxusColors);
      const baseChance = COUNTER_BASE_CHANCE_BY_DIFFICULTY[gameState.difficultyMode] || COUNTER_BASE_CHANCE_BY_DIFFICULTY[2];
      // Three factors stack here: difficulty, table size, and Voraxus's
      // own colour leaning toward (or away from) counterspells.
      const chance = baseChance
        * counterScaleForPlayers(gameState.numPlayers)
        * (affinity.H != null ? affinity.H : 1);

      if (Math.random() >= chance) {
        logVoraxusAction(`${gameState.botName} has no response.`);
        return;
      }

      const manaCost = pickCounterManaCost();
      pushUndoSnapshot();
      if (!checkAndDeductMana(manaCost)) return;
      spendCard();
      gameState.actionTally.H = (gameState.actionTally.H || 0) + 1;
      logVoraxusAction(`${gameState.botName} counters target spell or activated ability. (${manaCost} mana, 1 card)`);
    }

    /* ------------------------------------------------------------------
     *  Opponent buttons & turn handling
     * ---------------------------------------------------------------- */
    function createOpponentsButtons(includeAll) {
      const container = document.createElement("div");

      const btnCheckResponse = createButton("Check if Voraxus Responds", handleCheckResponse);
      btnCheckResponse.title = "Voraxus can only counter spells and activated abilities — not triggered abilities.";
      btnCheckResponse.classList.add("button-primary");
      container.appendChild(btnCheckResponse);
      if (includeAll) {
        container.appendChild(createButton("Apply Combat Damage", handleDamage));
      }
      container.appendChild(createButton("Apply Direct Damage", handleDirectDamage));

      btnForceDiscardRef = createButton("Force Discard", handleDiscardFromVoraxus);
      container.appendChild(btnForceDiscardRef);

      container.appendChild(createButton("Force Draw", handleDrawFromVoraxus));

      btnRemoveManaRef = createButton("Remove Mana", handleRemoveMana);
      container.appendChild(btnRemoveManaRef);

      btnRemoveManaSourceRef = createButton("Destroy Mana Source", handleRemoveManaSource);
      btnRemoveManaSourceRef.title = "Permanently reduces Voraxus's total mana, like destroying its lands.";
      container.appendChild(btnRemoveManaSourceRef);

      // Only offered when the difficulty actually imposes a hand limit.
      // At difficulties 4-5 Voraxus has no maximum hand size at all, so
      // there's nothing for this to modify and the button is omitted.
      if (!difficultyHasNoHandLimit()) {
        const btnMaxHand = createButton("Set Max Hand Size", handleSetMaxHandSize);
        btnMaxHand.title = "For spells that change maximum hand size. Applies at the end of Voraxus's turn.";
        container.appendChild(btnMaxHand);
      }

      container.appendChild(createButton("Give Voraxus a Creature", handleGiveCreature));

      if (includeAll) {
        container.appendChild(createButton("End Opponents' Turn", showMainMenu));
      }

      refreshActionButtonStates();
      return container;
    }

    function handleOpponentsTurn() {
      gameState.isVoraxusTurn = false;
      updateStatus();
      actionsBox.innerHTML = "";
      actionsBox.appendChild(createOpponentsButtons(true));
    }

    /* ------------------------------------------------------------------
     *  Voraxus' turn: "Continue" -> "Finish Turn"
     * ---------------------------------------------------------------- */
    function handleVoraxusTurn() {
      gameState.isVoraxusTurn = true;

      pushUndoSnapshot(); // covers the start-of-turn mana/card gain
      // Untap step first, exactly as in a real turn: everything that
      // tapped to attack last combat is available again.
      untapAllCreatures();
      gameState.voraxusTotalMana++;
      gameState.voraxusCurrentMana = gameState.voraxusTotalMana;
      if (!drawVoraxusCards(1)) {
        updateStatus();
        return;
      }
      // Standing permanents that trigger at the start of Voraxus's turn
      // (Mana Cache, Scrying Lens, Doom Beacon, Titan Forge, ...).
